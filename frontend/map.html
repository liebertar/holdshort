<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sky-net — runtime map</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root{--panel:rgba(12,17,21,.92);--line:#2a3740;--text:#e9f0f4;--dim:#93a4af;
        --guard:#3d8bff;--zone:#ff3b30;--warn:#e8b03a;--ok:#18b3a6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0e11;color:var(--text);
       font:12px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif}
  #map{position:absolute;inset:0}
  /* One card style. Background, border, corners, padding and type size are set only here — when
     each card differed, the screen looked like several tools stacked together. Three type sizes
     only: title 14 · body 12 · meta 11. */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
        backdrop-filter:blur(10px);box-shadow:0 6px 22px rgba(0,0,0,.3);font-size:12px;line-height:1.5}
  .card[hidden]{display:none}
  /* Minimizing a panel leaves only its title row (.bar · .topline · .line1). The button is a real
     button (focus, keyboard); the key shapes in the controls card are pictures. */
  .card .bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card .bar h2{margin:0}
  .bar-title{font-size:11px;font-weight:500;color:var(--dim);letter-spacing:.6px;text-transform:uppercase}
  .tools{display:flex;align-items:center;gap:6px}
  button.min{flex:0 0 auto;width:18px;height:18px;padding:0;border:1px solid var(--line);border-radius:4px;
             background:transparent;color:var(--dim);font:500 12px/1 system-ui,sans-serif;cursor:pointer}
  button.min:hover{color:var(--text);border-color:var(--dim)}
  button.min:focus-visible{outline:2px solid var(--ok);outline-offset:1px}
  .line1 button.min{float:right;margin-left:8px}
  /* !important: each panel's own layout (#legend>div's flex etc.) is more specific; without it the
     minimize rule lost and a minimized legend stayed open. */
  .card.min>:not(.bar):not(.line1):not(.topline){display:none!important}
  .card.min{padding-top:6px;padding-bottom:6px}
  .card.min .bar,.card.min .topline{margin:0}
  #keys{font-size:13px;color:var(--text);padding:10px 14px}
  /* A tall rectangle: one control per row — key on the left, meaning on the right. A thin rule
     separates the three mouse rows from the keyboard rows. */
  #keys .kgrid{display:grid;grid-template-columns:auto auto;column-gap:14px;row-gap:7px;align-items:center;
               margin-top:8px}
  #keys .kk{display:inline-flex;align-items:center;gap:5px}
  #keys .ksep{height:1px;background:var(--line);margin:1px 0}
  #keys svg.mouse{width:14px;height:19px;color:var(--text);flex:0 0 auto}
  #keys .kc{display:inline-block;min-width:22px;height:21px;padding:0 6px;border:1px solid var(--dim);
            border-bottom-width:2px;border-radius:4px;font:600 12px/18px ui-monospace,SFMono-Regular,Menlo,monospace;
            text-align:center;color:var(--text);cursor:default;user-select:none;box-sizing:border-box}
  #keys .plus{color:var(--dim);font-size:12px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  #banner .bar+div{border-top:0}
  .card h1{margin:0;font-size:14px;font-weight:600;letter-spacing:.2px}
  .card h2{margin:0 0 6px;font-size:11px;font-weight:500;color:var(--dim);letter-spacing:.6px;
           text-transform:uppercase}
  .meta{font-size:11px;color:var(--dim)}
  b{font-weight:500}
  a{color:var(--ok);text-decoration:none}
  .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
  /* Three columns: left (head, controls, legend), bottom centre (refusal, advisory, lost link),
     right (ledger, briefing, notices). Cards in a column stack and cannot overlap; an empty card
     takes no room. */
  /* The left column stacks too: head · controls (centred in the spare room) · legend (right above
     the attribution, which sits 12px from the bottom and is 26 tall, plus 6px: 44). The three used
     to be positioned separately, and at 1280×800 the legend covered the last two control rows
     (1–4 · L) by 60px. When room runs out, the legend shrinks and scrolls. */
  #left{position:absolute;top:12px;left:12px;bottom:44px;width:300px;display:flex;
        flex-direction:column;gap:10px;pointer-events:none}
  #left>.card{pointer-events:auto;flex:0 0 auto;min-height:0}
  #head p{margin:8px 0 0}
  #left>#keys{align-self:flex-start;margin:auto 0;white-space:nowrap;padding:8px 12px}
  #keys div{padding:1px 0}
  #left>#legend{flex:0 1 auto;min-height:56px;overflow:auto;line-height:1.8}
  #left>#legend.min{min-height:0}
  #legend>div:not(.meta){display:flex;flex-wrap:wrap;column-gap:12px}
  #legend .li{white-space:nowrap}
  #legend .meta{line-height:1.5;margin-top:3px}
  #right{position:absolute;top:12px;right:12px;bottom:12px;width:290px;display:flex;
         flex-direction:column;gap:10px;pointer-events:none}
  #right>.card{pointer-events:auto;flex:0 0 auto;min-height:0}
  /* Only the ledger card shrinks. It must be more specific than #right>.card — with just #acts the
     rule lost and the ledger ran off the bottom of the screen (to 864px at 1280×800). */
  #right>#acts{flex:0 1 auto;display:flex;flex-direction:column;overflow:hidden;min-height:118px}
  #feed{flex:1 1 auto;overflow:hidden;min-height:0}
  /* The briefing and the notices shrink too (only their lists scroll). When they did not, at
     1280×800 the ledger was left with its title row and the notices card fell off the screen
     (825px). The ledger keeps about four rows (118px). */
  #right>#briefing{flex:0 1 auto;display:flex;flex-direction:column;overflow:hidden;min-height:96px}
  /* The summary and the list shrink together and scroll separately. When only the summary held its
     size, the list went to 0px and no item could be seen. */
  #briefing .bf-summary{flex:0 1 auto;min-height:1.5em;overflow:auto}
  #briefing .bf-list{flex:0 1 auto;min-height:0}
  #right>#banner{flex:0 1 auto;overflow:auto;min-height:64px;margin-top:auto}
  #right>#acts.min,#right>#briefing.min,#right>#banner.min{min-height:0}
  #banner div{padding:2px 0}
  #banner div+div{border-top:1px solid var(--line)}
  #banner i{color:var(--warn);font-style:italic}
  /* Width of the centre stack. It is centred between the attribution at the bottom left (12–340px,
     364 allowed for font changes) and the zoom buttons on the right (314–345px from the right
     edge), 12px clear of each: half width ≤ 50% − 376px. */
  #stack{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
         width:min(460px,calc(100% - 752px));display:flex;flex-direction:column;gap:8px;
         pointer-events:none}
  #stack>.card{pointer-events:auto;overflow-wrap:anywhere;border-left-width:3px;cursor:pointer}
  #denial{border-left-color:var(--zone)}
  #denial.pulled{border-left-color:var(--warn)}
  #advisory{border-left-color:var(--warn)}
  #lostlink{border-left-color:var(--zone)}
  #lostlink div+div{margin-top:4px}
  /* Map controls. Zoom buttons left of the right column (the corner belongs to the notices card),
     attribution at the bottom left under the legend. In one shared corner the expanded
     attribution (352px) ran under the centre stack. Same panel colour as the cards — two white
     pills were the brightest thing on a dark screen. */
  .maplibregl-ctrl-bottom-right{right:302px}
  #map .maplibregl-ctrl-bottom-right .maplibregl-ctrl{margin:0 12px 12px 0}
  #map .maplibregl-ctrl-bottom-left .maplibregl-ctrl{margin:0 0 12px 12px}
  #map .maplibregl-ctrl-group{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    box-shadow:none;overflow:hidden}
  #map .maplibregl-ctrl-group button+button{border-top:1px solid var(--line)}
  #map .maplibregl-ctrl-group .maplibregl-ctrl-icon{filter:invert(.8)}
  #map .maplibregl-ctrl-attrib{background:var(--panel);border:1px solid var(--line);color:var(--dim);
    font-size:11px;line-height:18px}
  #map .maplibregl-ctrl-attrib a{color:var(--dim)}
  #map .maplibregl-ctrl-attrib-button{filter:invert(1)}
  /* Ledger. The last ten rows, fading further down. */
  .ev{padding:5px 0;border-top:1px solid var(--line);line-height:1.45}
  .ev:first-child{border-top:0}
  .ev:nth-child(n+5){opacity:.85}
  .ev:nth-child(n+8){opacity:.6}
  .ev[data-asset]{cursor:pointer}
  .ev[data-asset]:hover{background:rgba(255,255,255,.03)}
  /* Verdict tags. Type is 11 like meta — no fourth size. */
  .tag{display:inline-block;padding:0 5px;border-radius:4px;font-size:11px;line-height:16px;margin-right:5px;
       font-weight:600;letter-spacing:.3px;vertical-align:1px}
  .t-auto{background:rgba(24,179,166,.18);color:var(--ok)}
  .t-deny{background:rgba(255,59,48,.18);color:var(--zone)}
  .t-human{background:rgba(232,176,58,.18);color:var(--warn)}
  .t-lost{background:rgba(255,59,48,.18);color:#ff9d95}
  .tier{display:inline-block;padding:0 4px;border-radius:3px;font-size:11px;line-height:16px;font-weight:600;
        letter-spacing:.3px;background:rgba(118,185,0,.18);color:#a6e05a;vertical-align:1px}
  .k{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;
     vertical-align:-1px}
  /* 18px — at 22 the three items "planning · approved · rejected" overflow the legend width (300)
     by 5px and wrap. */
  .route-key{display:inline-block;width:18px;border-top:3px solid #29c76f;
             margin-right:5px;vertical-align:3px}
  .route-key.denied{border-color:var(--zone);border-top-style:dashed}
  .route-key.pending{border-color:#ffd23f;border-top-width:2px;border-top-style:dotted}
  .route-key.reserved{border-color:#29c76f;box-shadow:0 0 0 2px rgba(255,59,48,.45)}
  .line1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .line1 b{color:var(--text)}
  .note{margin-top:4px;font-size:11px;color:var(--dim);line-height:1.5}
  #denial-what,#advisory-source{color:var(--dim)}
  #advisory-source{margin-left:auto;font-size:11px}
  #denial-why,#advisory-summary{margin-top:5px}
  #advisory-options{list-style:none;margin:6px 0 0;padding:0;font-size:11px;line-height:1.5}
  #advisory-options li{padding:2px 0 2px 16px;position:relative;color:var(--dim)}
  #advisory-options li::before{content:"○";position:absolute;left:0;color:var(--dim)}
  #advisory-options li.ok{color:var(--text)}
  #advisory-options li.no{text-decoration:line-through;opacity:.7}
  #advisory-options li.chosen{color:#ffd98a}
  #advisory-options li.chosen::before{content:"●";color:var(--warn)}
  /* Buttons stay quiet — they are demo controls, not the subject of the screen. */
  #head .topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #lang{display:flex;gap:3px}
  #lang button,#restart{background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:2px 7px;font:500 11px inherit;cursor:pointer;letter-spacing:.3px;
    white-space:nowrap}
  #lang button.on{border-color:var(--guard);color:#bcd8ff}
  #restart::before{content:"↻ ";font-weight:400}
  #restart:hover{border-color:var(--warn);color:#ffd98a}
  .maplibregl-popup-content{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;font:12px/1.6 inherit;min-width:190px}
  .maplibregl-popup-tip{border-top-color:var(--panel)!important;
    border-bottom-color:var(--panel)!important}
  .maplibregl-popup-close-button{color:var(--dim);font-size:16px;padding:2px 6px}
  .pop h3{margin:0 0 6px;font-size:12px;font-weight:500;display:flex;align-items:center;gap:6px}
  .pop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
  .pop dt{color:var(--dim);font-size:11px}
  .pop dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  /* Runtime briefing. One item = kind glyph · place · one line · source domain · standing tag.
     Only the list scrolls when it overflows. */
  #briefing .bf-summary{margin-top:6px;color:var(--dim)}
  #briefing .bf-list{max-height:210px;overflow:auto;margin-top:4px}
  #briefing .bi{display:grid;grid-template-columns:14px 1fr;column-gap:8px;padding:5px 0;border-top:1px solid var(--line)}
  #briefing .bi:first-child{border-top:0}
  #briefing svg.kind{width:14px;height:14px;color:var(--dim);margin-top:2px}
  #briefing .bi-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
  #briefing .bi-top .tag,.bar .tools .tag{margin:0;white-space:nowrap;flex:0 0 auto}
  .t-info{background:rgba(147,164,175,.16);color:var(--dim)}
  .t-rec{background:rgba(232,176,58,.14);color:#ffd98a}
  /* The model's part. A small card beside the hovered aircraft — it steps aside so the aircraft
     stays visible. */
  #trace{position:absolute;z-index:5;width:300px;pointer-events:none}
  #trace dl{margin:6px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px}
  #trace dt{color:var(--dim);font-size:11px;white-space:nowrap;padding-top:1px}
  #trace dd{margin:0;overflow-wrap:anywhere}
  /* Demo captions (?demo=1). Bottom centre, large. The refusal and advisory stack moves above them. */
  #caption{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:min(780px,calc(100% - 720px));
           padding:10px 18px;text-align:center;pointer-events:none}
  #caption-text{font-size:19px;line-height:1.4;font-weight:500}
  #caption-text:empty,#caption-meta:empty{display:none}
  body.demo #stack{bottom:112px}
  /* The runtime label. Text on top of a raised mast, so it is a Marker, not a map layer (MapLibre
     symbols know no altitude). Two lines: the name, and what it is in smaller type. */
  .runtime-label{font:600 10.5px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.9px;
                 color:#cfe3ff;text-shadow:0 0 3px #0a0e11,0 0 6px #0a0e11;pointer-events:none;white-space:nowrap;
                 text-align:center}
  .runtime-label .runtime-sub{font-size:9px;font-weight:500;letter-spacing:.4px;color:#a9c6e8;margin-top:1px}
  /* Link keys match the pale links on the map. */
  .route-key.signal{border-color:#6fa8ff;border-top-width:2px;border-top-style:dotted;opacity:.6}
  .route-key.signal-lost{border-color:#7d8f9a;border-top-width:2px;border-top-style:dashed;opacity:.7}
  /* Route options (aircraft card). The chosen one gets ●. */
  .pop .rc{margin:4px 0 0;padding:0;list-style:none;font-size:11px;line-height:1.5}
  .pop .rc li{padding-left:14px;position:relative;color:var(--dim)}
  .pop .rc li::before{content:"○";position:absolute;left:0}
  .pop .rc li.chosen{color:var(--text)}
  .pop .rc li.chosen::before{content:"●";color:var(--ok)}
  @media(max-width:1280px){ #caption-text{font-size:16px} }
  /* Narrow screens. With no room in the centre, the stack moves to the left column under the head
     card (controls hidden). */
  @media(max-width:1050px){
    #keys{display:none}
    #stack{left:12px;transform:none;width:300px;top:248px;bottom:auto}
  }
  /* Short screens. When head + controls + one legend row do not fit the column, hide the controls
     (as on narrow screens). */
  @media(max-height:680px){ #keys{display:none} }
  @media(max-width:640px){
    #left{width:calc(100% - 24px)}
    #right{top:auto;bottom:12px;width:205px;max-height:50vh}
    #legend{max-width:calc(100% - 24px)}
    #stack{bottom:auto;top:200px;width:calc(100% - 24px)}
  }
</style>
</head>
<body>
<div id="map"></div>

<!-- Left column: head · controls · legend. Stacked, so they cannot overlap. -->
<div id="left">
<div class="card" id="head">
  <div class="topline">
    <h1 data-t="title"></h1>
    <div class="tools"><div id="lang"><button data-lang="en">EN</button><button data-lang="ko">KR</button></div><button type="button" class="min" data-min="head" aria-expanded="true" aria-label="minimize" title="minimize">–</button></div>
  </div>
  <p class="meta" data-t="lede"></p>
  <div class="row" style="margin-top:8px">
    <span class="meta"><span id="round-tick">tick 0</span> · <a href="approvals.html" data-t="approvals"></a></span>
    <button id="restart" data-t="restart"></button>
  </div>
  <p class="meta" id="llm-line"></p>
</div>

<!-- Controls. A picture, not buttons — mouse buttons and key shapes only, with no focus or clicks.
     Screen readers read the hidden sentence (.sr) for each row. -->
<div class="card meta" id="keys">
  <div class="bar"><span class="bar-title" data-t="keys_title"></span><button type="button" class="min" data-min="keys" aria-expanded="true" aria-label="minimize" title="minimize">–</button></div>
  <span class="sr" data-t="keys_mouse"></span><span class="sr" data-t="keys_arrows"></span><span class="sr" data-t="keys_letters"></span>
  <div class="kgrid" aria-hidden="true">
    <span class="kk"><svg class="mouse" viewBox="0 0 12 16"><rect x="1" y="1" width="10" height="14" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6 1.6V7.2" stroke="currentColor" stroke-width="1.2"/><path d="M5.4 1.7A4.4 4.4 0 0 0 1.6 6V7.2H5.4Z" fill="currentColor"/></svg></span><span data-t="k_pan"></span>
    <span class="kk"><svg class="mouse" viewBox="0 0 12 16"><rect x="1" y="1" width="10" height="14" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="4.9" y="3" width="2.2" height="4.4" rx="1.1" fill="currentColor"/></svg></span><span data-t="k_zoom"></span>
    <span class="kk"><svg class="mouse" viewBox="0 0 12 16"><rect x="1" y="1" width="10" height="14" rx="5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M6 1.6V7.2" stroke="currentColor" stroke-width="1.2"/><path d="M6.6 1.7A4.4 4.4 0 0 1 10.4 6V7.2H6.6Z" fill="currentColor"/></svg><span class="plus">/</span><span class="kc">Ctrl</span><span class="plus">+</span><span data-t="k_drag"></span></span><span data-t="k_orbit"></span>
    <span class="ksep"></span><span class="ksep"></span>
    <span class="kk"><span class="kc">←↑↓→</span></span><span data-t="k_pan"></span>
    <span class="kk"><span class="kc">Shift</span><span class="plus">+</span><span class="kc">←↑↓→</span></span><span data-t="k_rotate_tilt"></span>
    <span class="kk"><span class="kc">+</span><span class="kc">−</span></span><span data-t="k_zoom"></span>
    <span class="kk"><span class="kc">N</span></span><span data-t="k_north"></span>
    <span class="kk"><span class="kc">H</span></span><span data-t="k_home"></span>
    <span class="kk"><span class="kc">1</span><span class="plus">–</span><span class="kc">4</span></span><span data-t="k_focus"></span>
    <span class="kk"><span class="kc">L</span></span><span data-t="k_signals"></span>
  </div>
</div>

<!-- Legend. Only what is on screen now — renderLegend fills the rows from the snapshot. -->
<div class="card meta" id="legend" hidden></div>
</div>

<div id="right">

  <div class="card" id="acts" hidden>
    <div class="bar"><h2 data-t="ledger"></h2><button type="button" class="min" data-min="acts" aria-expanded="true" aria-label="minimize" title="minimize">–</button></div>
    <div id="feed"></div>
  </div>
  <!-- Runtime briefing. Cranes, events, closures and restrictions the runtime gathered by search,
       with source domain and standing. Filled by renderBriefing. -->
  <div class="card" id="briefing" hidden></div>
  <!-- Notices, weather and incidents. One card, one row per item. -->
  <div class="card" id="banner" hidden></div>
</div>

<!-- Bottom centre stack: refusal/recall card, runtime advisory, lost link — stacked top to bottom,
     never overlapping. -->
<div id="stack">
  <div class="card" id="denial" role="alert" aria-atomic="true" hidden>
    <div class="line1"><button type="button" class="min" data-min="denial" aria-expanded="true" aria-label="minimize" title="minimize">–</button><span class="tag t-deny"></span><b id="denial-who"></b>
      <span id="denial-what"></span></div>
    <div id="denial-why"></div>
    <div id="denial-more" class="note"></div>
  </div>
  <!-- Runtime advisory. Information the runtime left in the ledger after repeated refusals. It
       changes nothing — the operator decides. -->
  <div class="card" id="advisory" role="status" aria-atomic="true" hidden>
    <div class="line1"><button type="button" class="min" data-min="advisory" aria-expanded="true" aria-label="minimize" title="minimize">–</button><span class="tag t-human" id="advisory-tag"></span><b id="advisory-who"></b>
      <span id="advisory-source"></span></div>
    <div id="advisory-summary"></div>
    <ul id="advisory-options"></ul>
    <div id="advisory-note" class="note"></div>
  </div>
  <!-- Lost link. The runtime keeps that aircraft's 4D intent reserved — nobody may enter that
       space while it is dark. -->
  <div class="card" id="lostlink" role="alert" aria-atomic="true" hidden></div>
</div>

<!-- The model's part. Hover an aircraft or a ledger row (tap on touch) to read that filing's
     model_trace in plain words. -->
<div class="card" id="trace" role="tooltip" hidden></div>
<!-- Demo captions (?demo=1). One or two lines assembled from ledger codes and values. -->
<div class="card" id="caption" role="status" aria-live="polite" hidden><div id="caption-text"></div><div id="caption-meta" class="meta"></div></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>

let lang = "en";
try { lang = localStorage.getItem("skynet-lang") || "en"; } catch (error) { void error; }
// A function declaration on purpose — the screen-word checks (tests/test_map.mjs) look it up globally.
function t(key, ...args){
  const raw = TEXT[lang]?.[key] ?? TEXT.en[key] ?? key;
  return args.reduce((text, value) => text.replace("%s", value), raw);
}

// Minimized panels. The state stays in the browser — with storage blocked (private windows etc.) the
// page still works. Refusal, advisory and lost-link cards open again when a new event of their kind arrives.
const PANELS = ["head", "keys", "legend", "acts", "briefing", "banner", "denial", "advisory", "lostlink"];
const PANEL_STORE = "skynet-panels";
let minimized = {};
try { minimized = JSON.parse(localStorage.getItem(PANEL_STORE) || "{}") || {}; }
catch (error) { minimized = {}; }
let lostShown = new Set();
function isMinimized(id){
  return Boolean(minimized[id]);
}
function paintMinButton(button, on){
  button.textContent = on ? "+" : "–";
  const label = t(on ? "expand" : "minimize");
  button.setAttribute?.("aria-expanded", String(!on));
  button.setAttribute?.("aria-label", label);
  button.title = label;
}
function setMinimized(id, on, persist = true){
  minimized[id] = Boolean(on);
  const card = document.getElementById(id);
  if (card){
    if (card.classList) card.classList.toggle("min", minimized[id]);
    else card.min = minimized[id];
  }
  for (const button of (document.querySelectorAll?.(`[data-min="${id}"]`) || []))
    paintMinButton(button, minimized[id]);
  if (!persist) return;
  try { localStorage.setItem(PANEL_STORE, JSON.stringify(minimized)); } catch (error) { void error; }
}
// Lines the runtime wrote itself (intake, weather hold, notices, briefing) are about the runtime,
// not an aircraft. With the internal id a line read "intake information intake".
const RUNTIME_ASSETS = new Set(["intake", "fleet", "airspace", "briefing"]);
function assetWord(id){
  return RUNTIME_ASSETS.has(id) ? t("runtime_word") : id;
}
function minButton(id){
  const on = isMinimized(id), label = t(on ? "expand" : "minimize");
  return `<button type="button" class="min" data-min="${id}" aria-expanded="${!on}" ` +
         `aria-label="${label}" title="${label}">${on ? "+" : "–"}</button>`;
}
/** Title row of a card that is redrawn (legend, notices, lost link, briefing). Its button is handled
 * once for the whole document (the click below). extra is a tag right of the title and left of the
 * minimize button (the briefing's RECORDED). */
function panelBar(id, titleKey, extra = ""){
  const title = `<span class="bar-title">${t(titleKey)}</span>`;
  return extra
    ? `<div class="bar">${title}<span class="tools">${extra}${minButton(id)}</span></div>`
    : `<div class="bar">${title}${minButton(id)}</div>`;
}
document.addEventListener?.("click", event => {
  const button = event.target?.closest?.("[data-min]");
  if (!button) return;
  setMinimized(button.dataset.min, !isMinimized(button.dataset.min));
});

// Airspace arrives as [lat, lon]. GeoJSON wants [lon, lat] and a closed ring.
function closedRing(points){
  return [...points.map(p => [p[1], p[0]]), [points[0][1], points[0][0]]];
}

map.on("load", () => {
  // Zone colours are painted on the ground, before the buildings. Drawn after them, they tinted the
  // building walls, and aircraft and corridors passing over seemed to push the colour aside.
  const firstLabel = map.getStyle().layers.find(l => l.type === "symbol")?.id;
  addAirspaceLayers(firstLabel);
  if (map.getSource("openmaptiles")){
    map.addLayer({
      id:"apartments", type:"fill-extrusion", source:"openmaptiles",
      "source-layer":"building", minzoom:13,
      paint:{
        "fill-extrusion-color":["interpolate",["linear"],
          ["coalesce",["get","render_height"],10],
          0,"#e3eaee", 20,"#cfdae1", 60,"#b4c4ce", 120,"#9aadba"],
        "fill-extrusion-height":["coalesce",["get","render_height"],10],
        "fill-extrusion-base":["coalesce",["get","render_min_height"],0],
        "fill-extrusion-opacity":.92,
      },
    }, firstLabel);
    // Invisible footprints. Querying 3D buildings by point on a tilted map hits walls and roofs and
    // returns the wrong building; footprints are true coordinates, so only the building under the point answers.
    map.addLayer({id:"footprints", type:"fill", source:"openmaptiles",
      "source-layer":"building", minzoom:13, paint:{"fill-opacity":0}}, firstLabel);
  }
  // The warehouse is a building, not a dot: the tile building under the depot coordinates is painted
  // in warehouse colour. Building shapes can be queried only once the tiles are drawn, so it happens then.
  map.addSource("depot-building", {type:"geojson", data:empty()});
  map.addLayer({id:"depot-building", type:"fill-extrusion", source:"depot-building",
    paint:{"fill-extrusion-color":"#eee7ce", "fill-extrusion-opacity":.98,
      "fill-extrusion-height":["get","height"], "fill-extrusion-base":["get","base"]}}, firstLabel);


  // One set of route data: the raised corridors. Per-aircraft layers exist so each can blink on its own.
  map.addSource("flightpath", {type:"geojson", data:empty()});

  // What blocked it. A building stands red at its real height (the line must be seen entering it);
  // zones and grid cells are red on the ground only — a 900 m cell raised as a wall hid the refused corridor.
  map.addSource("blocker", {type:"geojson", data:empty()});
  map.addLayer({id:"blocker-ground", type:"fill", source:"blocker",
    filter:["==",["get","height"],0],
    paint:{"fill-color":"#ff3b30", "fill-opacity":.35}});
  map.addLayer({id:"blocker", type:"fill-extrusion", source:"blocker",
    filter:[">",["get","height"],0],
    paint:{"fill-extrusion-color":"#ff3b30", "fill-extrusion-base":0,
      "fill-extrusion-height":["get","height"], "fill-extrusion-opacity":.5}});
  // Where it was caught: that point on the filed line.
  map.addSource("breach", {type:"geojson", data:empty()});
  map.addLayer({id:"breach-dot", type:"circle", source:"breach",
    paint:{"circle-radius":7, "circle-color":"#ff3b30", "circle-opacity":.95,
      "circle-stroke-width":2, "circle-stroke-color":"#ffe9e7"}});
  map.addLayer({id:"breach-label", type:"symbol", source:"breach",
    layout:{"text-field":["get","label"], "text-size":12, "text-offset":[0,-1.5],
      "text-font":["Noto Sans Regular"], "text-allow-overlap":true},
    paint:{"text-color":"#ffc9c4", "text-halo-color":"#1a0806", "text-halo-width":2.2}});

  // The current phase, written at the route. Filing, refusal and approval must read from the screen alone.
  map.addSource("stage-label", {type:"geojson", data:empty()});
  map.addLayer({id:"stage-label", type:"symbol", source:"stage-label",
    layout:{"text-field":["get","label"], "text-size":12.5, "text-offset":[0,-1.3],

  map.addLayer({id:"depot-label", type:"symbol", source:"depot",

  // A landing area the briefing read as closed is grey — it takes no deliveries. Only the colour changes.
  const closedGrey = (open, closed) => ["case", ["boolean", ["get", "closed"], false], closed, open];
  map.addLayer({id:"landing-fill", type:"fill", source:"landing-disc",

  const raise = {"fill-extrusion-base":["get","base"], "fill-extrusion-height":["get","height"]};

              "text-field":["format",

                        ["concat","  ·  ",["upcase",["get","work"]]]], {"text-color":["get","tone"]},

                        ["concat","\n",["get","sub"]]], {"text-color":"#c8d4de","font-scale":.85}],

              // Lines break only at \n.
              "text-max-width":24,

              "text-offset":[0,1.6],"text-anchor":"top",
              "text-font":["Noto Sans Regular"],"text-allow-overlap":true},
      paint:{"text-color":"#3d8bff","text-halo-color":"#0a0e11","text-halo-width":1.4}});

  // Clicking an aircraft shows what it is doing right now, and why.
  map.on("click", "guarded-icon", event => {
    const id = event.features?.[0]?.properties?.id;
    const asset = latest?.worlds?.guarded?.assets?.[id];
    if (!asset) return;
    // Touch has no hover. The first tap on an aircraft opens the model-trace card; tapping again
    // opens the aircraft card as usual.
    if (!canHover() && traceTarget?.asset !== id && showTraceFor(id, event.point)) return;
    hideTrace();
    popup.setLngLat(event.lngLat).setHTML(assetCard(asset)).addTo(map);
  });
  map.on("mouseenter", "guarded-icon", () => {map.getCanvas().style.cursor = "pointer";});
  map.on("mouseleave", "guarded-icon", () => {map.getCanvas().style.cursor = "";});
  // The model's part. The card stands beside an aircraft (body or label) while the mouse is on it.
  for (const layer of ["craft-body", "guarded-icon"]){
    map.on("mousemove", layer, hoverAircraft);
    map.on("mouseleave", layer, () => hideTrace("aircraft"));
  }
  // Tapping empty map (touch) closes the card.
  map.on("click", event => {
    const hit = map.queryRenderedFeatures?.(event.point, {layers:["craft-body", "guarded-icon"]}) || [];
    if (!hit.length) hideTrace("aircraft");
  });
  // When a person moves the map, the director rests for 20 s. The director's own flyTo carries no
  // originalEvent, which tells the two apart.
  for (const type of ["dragstart", "zoomstart", "rotatestart", "pitchstart"]) map.on(type, userMoved);

  poll();
  requestAnimationFrame(draw);
});

/** Airspace painted on the ground. Below buildings, aircraft and corridors — one layer of the map floor. */
function addAirspaceLayers(before){
  // The real FAA grid; each block has its own ceiling.
  // Zones are colour on the ground only. Raised to their ceilings (0–200 m translucent walls) they
  // buried the 55 m corridors and aircraft, and the stacked translucency looked broken. The class
  // reads from the colour; the heights are in the legend and the refusal reasons. Nothing stands
  // over routes and aircraft.
  map.addSource("cells", {type:"geojson", data: empty()});
  map.addLayer({id:"cells-fill", type:"fill", source:"cells",
    paint:{"fill-color":["case",
        ["==",["get","rule"],"forbidden"], "#c1121f",
        ["interpolate",["linear"],["coalesce",["get","ceiling"],122],
          15,"#f08c3c", 30,"#f0b73c", 61,"#c9d14a", 91,"#7fc27a", 122,"#4aa3d1"]],
      "fill-opacity":["case",["==",["get","rule"],"forbidden"],.30,.14]}}, before);
  map.addLayer({id:"cells-line", type:"line", source:"cells",
    paint:{"line-color":["case",["==",["get","rule"],"forbidden"],"#c1121f","#7d8f9a"],
           "line-width":["case",["==",["get","rule"],"forbidden"],1.4,.5],
           "line-opacity":.6}}, before);

  // Zones closed mid-round — what the runtime enforces must be visible.
  map.addSource("zone", {type:"geojson", data: empty()});
  map.addLayer({id:"zone-fill", type:"fill", source:"zone",
    paint:{"fill-color":"#ff3b30","fill-opacity":.16}}, before);
  map.addLayer({id:"zone-line", type:"line", source:"zone",
    paint:{"line-color":"#ff3b30","line-width":2,"line-dasharray":[3,2]}}, before);
  // The zone's name. When buildings hid the circle, nothing but the banner said what was closed.
  map.addLayer({id:"zone-label", type:"symbol", source:"zone",
    layout:{"text-field":["get","name"], "text-size":11, "text-font":["Noto Sans Regular"],
            "text-allow-overlap":true, "symbol-placement":"point"},
    paint:{"text-color":"#ff3b30","text-halo-color":"#0a0e11","text-halo-width":1.4}});
}

const popup = new maplibregl.Popup({closeButton:true, closeOnClick:true, offset:14});
const safe = text => String(text ?? "").replace(/[<>&"]/g,
  c => ({"<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;"}[c]));

function assetCard(v){
  const rows = [
    [t("p_state"), t(v.state)],
    [t("p_battery"), `${Math.round(v.battery)}%`],
    [t("p_alt"), `${Math.round(v.alt_m ?? 0)} m`],
    [t("p_job"), v.job || "—"],
    [t("p_route"), `${(v.route || []).length}`],
    [t("p_done"), `${v.delivered ?? 0}`],
  ];
  const last = (lastRuntime?.ledger || []).find(e => e.proposal?.asset_id === v.id && e.outcome !== "pending");
  if (last){
    rows.push([t("p_form"), tierOf(last.proposal.author, v.id) || t("by_rules")]);
    const drafter = ROUTED.includes(last.proposal.action) ? drafterWord(last.proposal.params, last.proposal.params?.legs) : "";
    if (drafter) rows.push([t("p_drafter"), drafter]);
    rows.push([t("p_judged"), reasonText(last)]);
  }
  // When the model picked one of several candidates, list them as they were — ● on the chosen one.
  const options = routeOptions(latestChoice(v.id));
  return `<div class="pop"><h3>
      <span class="k" style="background:var(--guard)"></span>
      ${safe(v.id)}
      <span style="color:var(--dim);font-weight:400">${t("p_guarded")}</span>
    </h3><dl>${rows.map(([key, value]) =>
      `<dt>${safe(key)}</dt><dd>${safe(value)}</dd>`).join("")}</dl>${options}</div>`;
}

// Keyboard. The keys on the controls card are all there is, and the map needs no click for focus
// first (MapLibre's own key handling is off and everything is handled here — with both alive, one
// press moved the map twice).
map.keyboard?.disable?.();
const HOME_VIEW = {center:[-73.973, 40.718], zoom:14.5, pitch:45, bearing:-28};
// Screen pixels per arrow press. 100 is about a block at zoom 14.5 — a real step without losing your place.
const PAN_PX = 100;
const ARROW = {arrowleft:[-1, 0], arrowright:[1, 0], arrowup:[0, -1], arrowdown:[0, 1]};
function camera(what){
  if (what === "left") map.easeTo({bearing:map.getBearing() - 30, duration:400});
  else if (what === "right") map.easeTo({bearing:map.getBearing() + 30, duration:400});
  else if (what === "up") map.easeTo({pitch:Math.min(85, map.getPitch() + 15), duration:400});
  else if (what === "down") map.easeTo({pitch:Math.max(0, map.getPitch() - 15), duration:400});
  else if (what === "north") map.easeTo({bearing:0, duration:500});
  else if (what === "home") map.flyTo({...HOME_VIEW, duration:900});
}
/** One key to one map action. True when handled — the caller then stops the browser default (scrolling). */
function handleKey(event){
  if (event.metaKey || event.ctrlKey || event.altKey) return false;
  const tag = event.target?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return false;
  const key = String(event.key || "").toLowerCase();
  // Runtime links on and off. Not a camera key, so it does not pause the director.
  if (key === "l"){ toggleSignals(); return true; }
  if (key === "n") camera("north");
  else if (key === "h") camera("home");
  else if (/^[1-4]$/.test(key)) focusAsset(`drone-0${key}`);
  else if (event.shiftKey && key === "arrowleft") camera("left");
  else if (event.shiftKey && key === "arrowright") camera("right");
  else if (event.shiftKey && key === "arrowup") camera("up");
  else if (event.shiftKey && key === "arrowdown") camera("down");
  // Arrows without Shift pan. The right arrow brings in what was to the right.
  else if (ARROW[key]) map.panBy([ARROW[key][0] * PAN_PX, ARROW[key][1] * PAN_PX], {duration:250});
  else if (key === "+" || key === "=") map.zoomIn({duration:300});
  else if (key === "-" || key === "_") map.zoomOut({duration:300});
  else return false;
  pauseDirector();   // a person took the camera — the director rests meanwhile
  return true;
}
document.addEventListener?.("keydown", event => {
  if (handleKey(event)) event.preventDefault();
});

// Clicking a card or a ledger row flies to that aircraft: close enough to read the buildings, aircraft centred.

}
