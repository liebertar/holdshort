  // The label floats at the mast top, so it is a Marker, not a map layer (MapLibre symbols know no altitude).
  if (!runtimeMarker && typeof maplibregl.Marker === "function" && document.createElement){
    const element = document.createElement("div");
    element.className = "runtime-label";
    runtimeMarker = new maplibregl.Marker({element, anchor:"bottom"})
      .setLngLat([RUNTIME_SITE.lon, RUNTIME_SITE.lat]).addTo(map);
  }
  if (runtimeMarker) runtimeMarker.getElement().innerHTML = runtimeLabelHtml();
}
/** How far up the screen a raised marker's label goes: the map's exact 3D projection when it offers
 * one, else an approximation. */
function altitudeOffset(lon, lat, altM){
  try {
    const transform = map.transform;
    if (transform?.coordinatePoint && maplibregl.MercatorCoordinate?.fromLngLat){
      const coord = maplibregl.MercatorCoordinate.fromLngLat({lng:lon, lat});
      const ground = transform.coordinatePoint(coord, 0), up = transform.coordinatePoint(coord, altM);
      if (Number.isFinite(up?.y) && Number.isFinite(ground?.y)) return [up.x - ground.x, up.y - ground.y];
    }
  } catch (error) { void error; }
  return [0, -altitudeLift(map.getZoom?.() ?? 14.5, map.getPitch?.() ?? 45, lat, altM)];
}
/** Keep the runtime label on the mast top as the camera moves. */
function placeRuntimeLabel(){
  if (!runtimeMarker) return;
  const element = runtimeMarker.getElement();
  element.hidden = !signalsOn;
  if (element.hidden) return;
  const [dx, dy] = altitudeOffset(RUNTIME_SITE.lon, RUNTIME_SITE.lat, RUNTIME_ALT_M + 10);
  runtimeMarker.setOffset([dx, dy]);
}
/** One closed ledger decision = one dot (or two) travelling a link, timed to its replayed stage when there is one. */
function spawnSignals(runtime, now){
  const assets = latest?.worlds?.guarded?.assets || {};
  const closed = (runtime.ledger || []).filter(e => e.outcome !== "pending");
  const fresh = closed.filter(e => !signalSeen.has(e.id) && e.at >= roundStartedAt
    && Date.now() - e.at * 1000 < DENIAL_MS);
  signalSeen.clear();
  for (const entry of closed) signalSeen.add(entry.id);
  for (const entry of [...fresh].sort((a, b) => a.at - b.at)){
    const asset = entry.proposal?.asset_id;
    if (!assets[asset]) continue;
    if (!isFiling(entry)){
      // A recall is sent down from the runtime to the aircraft, in red. Other runtime rows are not link traffic.
      if (PULLED_CODES.has(entry.decision?.code))
        pushSignal(asset, "down", SIGNAL_COLOUR.recall, now);
      continue;
    }
    const stage = stages.find(s => s.id === entry.id);
    const filed = stage ? stage.at : now;
    const judged = stage ? stage.at + GROW_MS + CHECK_MS - SIGNAL_TRAVEL_MS : now + SIGNAL_TRAVEL_MS;
    pushSignal(asset, "up", SIGNAL_COLOUR.file, filed);
    pushSignal(asset, "down", SIGNAL_COLOUR[entry.decision?.verdict] || SIGNAL_COLOUR.human,
               Math.max(filed + SIGNAL_TRAVEL_MS * 0.8, judged));
  }
  // Telemetry. Only on live links, one dot per aircraft every few seconds — nothing rises from a dark aircraft.
  const ids = Object.keys(assets).sort();
  ids.forEach((id, index) => {
    if (linkLost(id)){ telemetryDotAt.delete(id); return; }
    const last = telemetryDotAt.get(id);
    if (last === undefined){
      telemetryDotAt.set(id, now - index * (TELEMETRY_EVERY_MS / Math.max(1, ids.length)));
      return;
    }
    if (now - last < TELEMETRY_EVERY_MS) return;
    pushSignal(id, "up", SIGNAL_COLOUR.tick, now, "tick");
    telemetryDotAt.set(id, now);
  });
}
function pushSignal(asset, dir, colour, start, kind = "dot"){
  signalEvents.push({asset, dir, colour, start, kind, duration: kind === "tick" ? 1700 : SIGNAL_TRAVEL_MS});
  if (signalEvents.length > 60) signalEvents.splice(0, signalEvents.length - 60);
}
function drawSignals(now, drawn){
  if (!signalsOn){
    if (signalBuiltAt !== null){
      map.getSource("signal-line")?.setData(empty());
      map.getSource("signal-dot")?.setData(empty());
      signalBuiltAt = null;
    }
    return;
  }
  const mast = runtimePoint();
  if (signalBuiltAt === null || now - signalBuiltAt >= SIGNAL_REBUILD_MS){
    const lines = [];
    // Width follows the zoom — fixed in metres, a link is under a pixel on wide views (below zoom 14) and vanishes.
    const halfM = signalHalfWidth(map.getZoom?.() ?? 16, mast.lat);
    for (const [id, at] of drawn){
      const lost = linkLost(id);
      for (const piece of signalDashes(at, mast, lost, halfM))
        lines.push(extrusion(piece, {asset:id, kind: lost ? "lost" : "line"}));
    }
    map.getSource("signal-line")?.setData({type:"FeatureCollection", features:lines});
    signalBuiltAt = now;
  }
  const dots = [];
  for (const event of signalEvents){
    const progress = (now - event.start) / event.duration;
    const at = drawn.get(event.asset);
    if (progress < 0 || progress > 1 || !at || linkLost(event.asset)) continue;
    dots.push(extrusion(signalDot(at, mast, event.dir === "up" ? progress : 1 - progress,
                                  event.kind === "tick" ? 3.5 : 7),
                        {asset:event.asset, kind:event.kind, colour:event.colour}));
  }
  map.getSource("signal-dot")?.setData({type:"FeatureCollection", features:dots});
  signalEvents = signalEvents.filter(event => now <= event.start + event.duration);
}

// ---------- PX4 SITL mirror ----------
// Aircraft in /state.autopilots have a real autopilot (PX4) receiving the same commands. Its position
// is drawn as a ghost — judgement uses the simulator's telemetry; the ghost shows the command reached
// an autopilot.
function renderAutopilots(runtime, now){
  const pilots = runtime?.autopilots || {};
  for (const [asset, pilot] of Object.entries(pilots)){
    const lat = Number(pilot?.lat), lon = Number(pilot?.lon);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
    const previous = px4Motion.get(asset);
    px4Motion.set(asset, {start: previous ? motionPoint(previous, now, POLL_MS) : [lon, lat],
                          end:[lon, lat], at:now, pilot});
  }
  for (const asset of [...px4Motion.keys()]) if (!pilots[asset]) px4Motion.delete(asset);
}
function drawPx4(now){
  const bodies = [], labels = [];
  for (const [asset, motion] of px4Motion){
    const [lon, lat] = motionPoint(motion, now, POLL_MS);
    const ahead = motionPoint(motion, now + 16, POLL_MS);
    const heading = ahead[0] === lon && ahead[1] === lat ? 0
      : Math.atan2((ahead[0] - lon) * Math.cos(lat * Math.PI / 180), ahead[1] - lat) * 180 / Math.PI;
    for (const part of droneBody(lat, lon, Math.max(0, Number(motion.pilot.alt_m) || 0), heading, 1.35))
      bodies.push(extrusion(part, {asset}));
    labels.push({type:"Feature", geometry:{type:"Point", coordinates:[lon, lat]},
                 properties:{asset, label:px4Label(asset, motion.pilot)}});
  }
  map.getSource("px4")?.setData({type:"FeatureCollection", features:bodies});
  map.getSource("px4-label")?.setData({type:"FeatureCollection", features:labels});
}
function px4Label(asset, pilot){
  const parts = [pilot.mode ? String(pilot.mode) : "",
                 pilot.mission_seq == null ? "" : t("px4_step", pilot.mission_seq),
                 t(pilot.armed ? "px4_armed" : "px4_disarmed"),
                 Number(pilot.last_heartbeat_s) > 5 ? t("px4_stale", Math.round(pilot.last_heartbeat_s)) : ""];
  return `PX4 SITL · ${asset}\n${parts.filter(Boolean).join(" · ")}`;
}

// ---------- Demo director (?demo=1) ----------
// For recordings. When a new scene appears in the ledger or /state, the camera flies to that aircraft
// or zone, stays long enough to read, and returns to the wide view. Captions are assembled only from
// ledger codes and values — nothing is made up. A person moving the map pauses it for 20 s. Without
// ?demo=1 nothing below does anything.
const DIRECTOR_PAUSE_MS = 20000;
const SHOT_MIN_MS = 3500;      // shown at least this long even when a more urgent scene arrives
const SHOT_STALE_MS = 25000;   // a scene queued longer than this is already history
const REST_MS = 4000;          // after returning to the wide view, before refusal scenes are taken again
const FLY_MS = 2200;
// Briefings arrive several at once at the start of a round. Priority 2, so they never push out
// notice, weather, fire or lost-link scenes (3).
const SHOT_PRIORITY = {refusal:1, advisory:2, recall:2, restored:2, briefing:2,
                       notice:3, held:3, weather:3, fire:3, lost:3, directive:3};
const SHOT_HOLD = {refusal:7000, advisory:8000, recall:7000, restored:5000, briefing:7000,
                   notice:9000, held:8000, weather:9000, fire:9000, lost:10000, directive:8000};

function resetDirector(){
  director.queue = []; director.current = null;
  director.seen.clear(); director.ledgerSeen.clear(); director.lost.clear();
  director.restUntil = 0;
  renderCaption();
}
function userMoved(event){
  if (event?.originalEvent) pauseDirector();
}
function pauseDirector(now = performance.now()){
  if (!DEMO) return;
  director.pausedUntil = now + DIRECTOR_PAUSE_MS;
}
function directorFeed(data, runtime, now){
  if (!DEMO || !runtime) return;
  for (const shot of sceneShots(data, runtime)) queueShot(shot, now);
  for (const entry of freshLedger(runtime)) ledgerShot(entry, now);
}
function freshLedger(runtime){
  const closed = (runtime.ledger || []).filter(e => e.outcome !== "pending");
  const fresh = closed.filter(e => !director.ledgerSeen.has(e.id) && e.at >= roundStartedAt
    && Date.now() - e.at * 1000 < 10000);
  director.ledgerSeen.clear();
  for (const entry of closed) director.ledgerSeen.add(entry.id);
  return fresh.sort((a, b) => a.at - b.at);
}
function ledgerShot(entry, now){
  const p = entry.proposal, d = entry.decision || {};
  if (p.author === "runtime"){
    if (d.code === "recalled") queueShot(recallShot(entry), now);
    return;
  }
  if (!latest?.worlds?.guarded?.assets?.[p.asset_id]) return;
  if (d.verdict === "denied" && d.code !== "duplicate" && ["fly_route", "depart"].includes(p.action))
    queueShot(refusalShot(entry), now);
  else if (d.verdict === "auto" && p.action === "fly_route") refiled(entry, now);
}
/** When that aircraft's new route is approved during its refusal scene, the same shot just continues
 * the caption — the story must end. */
function refiled(entry, now){
  const current = director.current;
  director.queue = director.queue.filter(s => !(s.kind === "refusal" && s.asset === entry.proposal.asset_id));
  if (!current || current.kind !== "refusal" || current.asset !== entry.proposal.asset_id) return;
  const params = entry.proposal.params || {};
  current.caption = () => t("cap_refiled", entry.proposal.asset_id, filedPhrase(params),
                            approvedWord(entry.decision, params, entry.proposal.asset_id));
  current.until = Math.max(current.until, now + 5000);
  captionKey = null;
}
function sceneShots(data, runtime){
  const shots = [];
  for (const notice of runtime.notices || []){
    if (notice.kind === "incident") continue;            // incidents below know the radius too
    if (notice.citation) shots.push(briefingShot(notice));   // set by the runtime briefing — told with its source
    else if (notice.applied) shots.push(noticeShot(notice));
    else if (notice.held) shots.push(heldShot(notice));
  }
  if (runtime.weather?.hold) shots.push(weatherShot(runtime.weather.hold));
  for (const incident of runtime.incidents || []) if (incident.applied) shots.push(fireShot(incident));
  for (const [asset, link] of Object.entries(runtime.links || {})){
    if (link?.status === "lost"){
      director.lost.add(asset);
      shots.push(lostShot(asset, link));
    } else if (director.lost.has(asset)){
      director.lost.delete(asset);
      shots.push(restoredShot(asset, link));
    }
  }
  for (const advisory of runtime.advisories || [])
    if (advisory.ledger_id && (advisory.at ?? 0) >= roundStartedAt
        && Date.now() - (advisory.at ?? 0) * 1000 < ADVISORY_MS) shots.push(advisoryShot(advisory));
  for (const bulletin of data?.bulletins || [])
    if (bulletin.kind === "recall") shots.push(directiveShot(bulletin));
  return shots.filter(Boolean);
}
function queueShot(shot, now){
  if (!shot?.camera || director.seen.has(shot.id)) return;
  director.seen.add(shot.id);
  const priority = SHOT_PRIORITY[shot.kind] || 1;
  // Refusals come every few seconds. With a scene queued or playing, a refusal is dropped — the
  // ledger card still shows it.
  if (priority === 1 && (director.queue.length || (director.current && director.current.priority > 1))) return;
  director.queue.push({...shot, priority, holdMs:SHOT_HOLD[shot.kind] || 7000, queuedAt:now});
}
function pickShot(now){
  director.queue = director.queue.filter(shot => now - shot.queuedAt < SHOT_STALE_MS);
  if (!director.queue.length) return null;
  const best = director.queue.reduce((a, b) => (b.priority > a.priority ? b : a));
  const current = director.current;
  if (current && (best.priority <= current.priority || now - current.started < SHOT_MIN_MS)) return null;
  if (!current && best.priority === 1 && now < director.restUntil) return null;
  director.queue.splice(director.queue.indexOf(best), 1);
  return best;
}
function directorTick(now){
  if (!DEMO) return;
  const paused = now < director.pausedUntil;
  if (director.current && now >= director.current.until){
    director.current = null;
    if (!paused && !director.queue.length){
      map.flyTo({...HOME_VIEW, bearing:currentBearing(), duration:FLY_MS + 400, essential:true});
      director.restUntil = now + REST_MS;
    }
  }
  if (!paused){
    const next = pickShot(now);
    if (next){
      director.current = {...next, started:now, until:now + next.holdMs};
      map.flyTo({...next.camera, duration:FLY_MS, essential:true});
    }
  }
  renderCaption(now);
}
function renderCaption(now = performance.now()){
  const card = document.getElementById("caption");
  if (!card) return;
  const text = DEMO && director.current ? director.current.caption() : "";
  const paused = DEMO && now < director.pausedUntil
    ? t("cap_paused", Math.ceil((director.pausedUntil - now) / 1000)) : "";
  const key = `${text}|${paused}`;
  if (key === captionKey) return;
  captionKey = key;
  document.getElementById("caption-text").textContent = text;
  document.getElementById("caption-meta").textContent = paused;
  card.hidden = !text && !paused;
}

// Camera. Each scene needs something different in frame — a refusal the aircraft and what blocked it,
// a notice the whole zone, a weather hold the warehouse and the grounded aircraft, an incident its
// circle, a lost link that aircraft.
function currentBearing(){
  return map.getBearing?.() ?? HOME_VIEW.bearing;
}
function assetPoint(asset){
  const v = latest?.worlds?.guarded?.assets?.[asset];
  return v && Number.isFinite(Number(v.lat)) ? {lat:Number(v.lat), lon:Number(v.lon)} : null;
}
function pointCamera(at, zoom = 16.2, pitch = 58){
  return at ? {center:[at.lon, at.lat], zoom, pitch, bearing:currentBearing()} : null;
}
function spanCamera(points, pitch = 55, minZoom = 13.6, margin = 1.8){
  const valid = (points || []).filter(p => p && Number.isFinite(Number(p.lat)) && Number.isFinite(Number(p.lon)));
  if (!valid.length) return null;
  // The centre is the midpoint of the extremes (not the mean), so a far point stays in frame even
  // when the others cluster.
  const lats = valid.map(p => Number(p.lat)), lons = valid.map(p => Number(p.lon));
  const lat = (Math.min(...lats) + Math.max(...lats)) / 2, lon = (Math.min(...lons) + Math.max(...lons)) / 2;
  const scale = Math.cos(lat * Math.PI / 180) || 1;
  let span = 0;
  for (const a of valid) for (const b of valid)
    span = Math.max(span, Math.hypot((a.lon - b.lon) * scale, a.lat - b.lat) * 111320);
  return {center:[lon, lat], zoom:zoomForSpan(Math.max(360, span * margin), lat, 620, minZoom), pitch,
          bearing:currentBearing()};
}
/** The zoom that fits this span (m). MapLibre tiles are 512 px. Too far out the 3D stops reading, so
 * it stops at minZoom. */
function zoomForSpan(spanM, lat, px = 620, minZoom = 13.6){
  const zoom = Math.log2(40075016.686 * (Math.cos(lat * Math.PI / 180) || 1) * px / (512 * spanM));
  return Math.max(minZoom, Math.min(16.8, Math.round(zoom * 100) / 100));
}
function ringPoints(polygon){
  return (polygon || []).map(p => ({lat:p[0], lon:p[1]}));
}
function depotCamera(zoom = 16, pitch = 55){
  const depot = latest?.worlds?.guarded?.depot_coords;
  return depot ? {center:[depot.lon + 0.0006, depot.lat], zoom, pitch, bearing:currentBearing()}
               : {...HOME_VIEW, bearing:currentBearing()};
}

// One scene. id makes sure it plays once; caption is called again when the language changes.
function refusalShot(entry){
  const p = entry.proposal, params = p.params || {};
  const from = params.legs?.[0] || assetPoint(p.asset_id);
  const camera = params.blocked_at ? spanCamera([from, params.blocked_at]) : pointCamera(from);
  return {id:`refusal:${entry.id}`, kind:"refusal", asset:p.asset_id, camera,
          caption:() => refusalCaption(entry)};
}
function refusalCaption(entry){
  const p = entry.proposal, params = p.params || {};
  if (entry.decision?.code !== "airspace")
    return t("cap_policy", p.asset_id, t(p.action), reasonText(entry));
  const destination = latest?.worlds?.guarded?.assets?.[p.asset_id]?.job;
  const filed = filedPhrase(params), blocked = blockPhrase(params);
  return destination ? t("cap_refused", p.asset_id, filed, destination, blocked)
                     : t("cap_refused_here", p.asset_id, filed, blocked);
}
/** What was filed — the filing's drafter value as is. */
function filedPhrase(params){
  const drafter = String(params?.drafter || "");
  if (params?.route_choice?.chosen)
    return t("cap_filed_choice", candidateLabel(params.route_choice.chosen, params.route_choice.candidates));
  if (drafter === "straight" || (!drafter && (params?.legs || []).length === 2)) return t("cap_filed_straight");
  if (drafter === "astar") return t("cap_filed_astar");
  return drafter ? t("cap_filed_draft") : t("cap_filed_route");
}
/** What blocked it — only the values the verdict left. */
function blockPhrase(params){
  const id = String(params.blocked_volume || ""), kind = params.blocked_kind;
  const height = Math.round(Number(params.blocked_ceiling_m) || 0);
  const brief = briefingFor(id);
  if (kind === "traffic") return t("cap_blk_traffic", params.blocked_asset || "—");
  if (kind === "landing") return t("cap_blk_landing", placePhrase(params, brief, height));
  if (kind === "takeoff") return t("cap_blk_takeoff", placePhrase(params, brief, height));
  if (brief?.kind === "crane")
    return t("cap_blk_crane", height || Math.round(Number(brief.height_m) || 0) || "—",
             sourceWord(brief.domain, brief.recorded));
  if (id.startsWith("bldg-")) return t("cap_blk_building", height);
  if (kind === "ceiling") return t("cap_blk_ceiling", height);
  if (id.startsWith("uasfm-")) return t("cap_blk_grid");
  if (ENDPOINTS.has(kind) || kind === "column") return blockedLabel(params);
  return t("cap_blk_zone", brief?.place || params.blocked_name || noticeName(id) || t("blk_zone"));
}
function placePhrase(params, brief, height){
  if (brief) return briefingLabel(brief, height, params);
  const id = String(params.blocked_volume || "");
  return id.startsWith("bldg-") ? t("blk_building", height)
    : params.blocked_name || noticeName(id) || params.blocked_asset || id || "—";
}
function noticeName(id){
  if (!id) return "";
  const notice = (lastRuntime?.notices || []).find(n => n.id === id);
  if (notice) return notice.name || notice.id;
  const zone = latest?.worlds?.guarded?.zone;
  return zone && zone.id === id ? zone.name || zone.id : "";
}
function recallShot(entry){
  // On a recall row detail.resource is the aircraft; the rule is policy_hit / detail.policy (as in
  // r_recalled). Live, it showed "(drone-01)" until this was fixed.
  const asset = entry.proposal.asset_id, detail = entry.decision.detail || {};
  const rule = entry.decision.policy_hit || detail.policy || "";
  return {id:`recall:${entry.id}`, kind:"recall", asset, camera:pointCamera(assetPoint(asset), 15.8, 55),
          caption:() => t("cap_recall", asset, noticeName(rule) || rule || "—")};
}
function noticeShot(notice){
  return {id:`notice:${notice.id}`, kind:"notice", camera:spanCamera(ringPoints(notice.polygon), 50)
            || depotCamera(15.4, 50),
          caption:() => t("cap_notice", notice.name || notice.id, notice.from_tick ?? "—",
                          notice.until_tick ?? "∞", noticeSource(notice.source))};
}
function heldShot(notice){
  return {id:`held:${notice.id}`, kind:"held",
          camera:spanCamera(ringPoints(notice.polygon), 50) || depotCamera(15.4, 50),
          caption:() => t("cap_notice_held", notice.name || notice.id, noticeSource(notice.source))};
}
function weatherShot(hold){
  // Grounded aircraft are not only at the warehouse — a weather hold also keeps aircraft landed at a
  // delivery point (at tick 2624 of seed 7 all four were). Frame the warehouse and every grounded aircraft.
  const grounded = Object.values(latest?.worlds?.guarded?.assets || {})
    .filter(v => !(Number(v.alt_m) > 1)).map(v => ({lat:Number(v.lat), lon:Number(v.lon)}));
  const depot = latest?.worlds?.guarded?.depot_coords;
  // The wide view tilts less (35°) — at 45° the near side (the warehouse) was cut off at the bottom.
  const camera = grounded.length ? spanCamera([depot, ...grounded], 35, 12.6, 2.2) : depotCamera(16, 55);
  return {id:`weather:${hold.id}`, kind:"weather", camera,
          caption:() => t("cap_weather", holdWhy(hold.reason), hold.until_tick ?? "—")};
}
function fireShot(incident){
  const centre = incident.centre ? {lat:incident.centre[0], lon:incident.centre[1]} : null;
  const radius = Math.round(Number(incident.radius_m) || 0);
  const camera = centre
    ? {center:[centre.lon, centre.lat], zoom:zoomForSpan(Math.max(400, radius * 5), centre.lat),
       pitch:52, bearing:currentBearing()}
    : depotCamera(15.4, 52);
  return {id:`fire:${incident.id}`, kind:"fire", camera,
          caption:() => t("cap_fire", incident.name || incident.place || incident.id, radius,
                          incident.until_tick ?? "∞")};
}
function lostShot(asset, link){
  return {id:`lost:${asset}:${link.since_tick ?? "—"}`, kind:"lost", asset,
          camera:pointCamera(assetPoint(asset), 16.2, 58),
          caption:() => t("cap_lost", asset, link.since_tick ?? link.last_seen_tick ?? "—")};
}
function restoredShot(asset, link){
  return {id:`back:${asset}:${link?.since_tick ?? "—"}`, kind:"restored", asset,
          camera:pointCamera(assetPoint(asset), 16, 55), caption:() => t("cap_restored", asset)};
}
function advisoryShot(advisory){
  const chosen = (advisory.options || []).find(o => o.id === advisory.chosen) || {id:advisory.chosen};
  return {id:`advisory:${advisory.ledger_id}`, kind:"advisory", asset:advisory.asset,
          camera:pointCamera(assetPoint(advisory.asset), 16, 55),
          caption:() => t("cap_advisory", (advisory.refusals || []).length, advisory.asset, optionLabel(chosen))};
}
function directiveShot(bulletin){
  return {id:`directive:${bulletin.id}`, kind:"directive", camera:depotCamera(15.6, 52),
          caption:() => t("cap_recall_ad", bulletin.applies_to?.model || bulletin.id,
                          bulletin.published_tick ?? "—", bulletin.until_tick ?? "∞")};
}
/** One rule the runtime briefing applied (or holds for a person). Name and source domain as in the notice record. */
function briefingShot(notice){
  if (!notice.applied && !notice.held) return null;
  const centre = ringCentre(notice.polygon);
  const key = notice.held ? "cap_briefing_held" : notice.kind === "closure" ? "cap_briefing_closed" : "cap_briefing";
  const camera = notice.kind === "crane" || notice.kind === "closure"
    ? pointCamera(centre, 16, 55) : spanCamera(ringPoints(notice.polygon), 50);
  return {id:`briefing:${notice.id}:${notice.held ? "held" : "applied"}`, kind:"briefing", camera,
          caption:() => t(key, notice.name || notice.id,
                          sourceWord(notice.citation?.domain, notice.citation?.recorded))};
}
</script>
