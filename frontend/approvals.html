<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sky-net — manual approval</title>
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0b0f12; --panel:#141a1f; --line:#243038; --text:#e6eef2; --dim:#7d8f9a;
    --good:#0d6e70; --goodline:#18b3a6; --bad:#7a2f2f; --badline:#e2703a; --warn:#e8b03a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif}
  header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;
         align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:17px;margin:0;letter-spacing:.4px}
  .tag{font-size:12px;color:var(--dim)}
  .tag b{color:var(--text);font-weight:600}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px 22px 32px}
  .col{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
  .col h2{margin:0;padding:12px 16px;font-size:14px;border-bottom:1px solid var(--line);
          display:flex;justify-content:space-between;align-items:center}
  .col.guarded h2{background:linear-gradient(90deg,rgba(13,110,112,.45),transparent)}
  .col.direct h2{background:linear-gradient(90deg,rgba(122,47,47,.45),transparent)}
  .sub{font-size:11px;color:var(--dim);font-weight:400}
  canvas{display:block;width:100%;height:230px;background:#0e1418}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:7px 16px;border-top:1px solid var(--line)}
  td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .zero{color:var(--goodline)} .hit{color:var(--badline)} .idle{color:var(--dim)}
  .box{padding:12px 16px;border-top:1px solid var(--line)}
  .box h3{margin:0 0 8px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.6px}
  .card{border:1px solid var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:8px;
        background:rgba(232,176,58,.08)}
  .card .why{color:var(--dim);font-size:12px;margin:4px 0 8px}
  .rec{display:inline-block;padding:0 6px;border-radius:4px;font-size:11px;font-weight:600;
       background:rgba(232,176,58,.18);color:#ffd98a}
  button{font:inherit;padding:5px 12px;border-radius:6px;border:1px solid var(--line);
         background:#1d262c;color:var(--text);cursor:pointer;margin-right:6px}
  button.ok{background:var(--good);border-color:var(--goodline)}
  button.no{background:#2a1b1b;border-color:#7a2f2f}
  .lang{margin-left:auto;display:flex;gap:3px}
  .lang button{padding:2px 7px;margin:0;font-size:11px;background:transparent;color:var(--dim)}
  .lang button.on{border-color:var(--goodline);color:var(--text)}
  .log{font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim);
       max-height:150px;overflow:auto}
  .log b{color:var(--text);font-weight:600}
  .empty{color:var(--dim);font-size:12px}
  .banner{margin:0 22px 4px;padding:9px 14px;border-radius:8px;background:rgba(232,176,58,.12);
          border:1px solid var(--warn);font-size:13px;display:none}
</style>
</head>
<body>
<header>
  <h1 data-t="title"></h1>
  <span class="tag">tick <b id="tick">0</b></span>
  <span class="tag"><span data-t="model"></span> <b id="llm"></b></span>
  <span class="tag" data-t="tagline"></span>
  <span class="tag"><a href="map.html" style="color:#18b3a6" data-t="map_link"></a></span>
  <span class="lang"><button data-lang="en">EN</button><button data-lang="ko">KR</button></span>
</header>
<div class="banner" id="recall"></div>
<div class="wrap">
  <section class="col guarded">
    <h2><span data-t="guarded_title"></span><span class="sub" data-t="guarded_sub"></span></h2>
    <canvas id="map-guarded"></canvas>
    <table id="score-guarded"></table>
    <div class="box"><h3 data-t="inbox_title"></h3><div id="inbox"></div></div>
    <div class="box"><h3 data-t="ledger_title"></h3><div class="log" id="ledger"></div></div>
  </section>
  <section class="col direct">
    <h2><span data-t="direct_title"></span><span class="sub" data-t="direct_sub"></span></h2>
    <canvas id="map-direct"></canvas>
    <table id="score-direct"></table>
    <div class="box"><h3 data-t="events_title"></h3><div class="log" id="events"></div></div>
  </section>
</div>
<script>
const SIM = `http://${location.hostname}:8100`;
const RT  = `http://${location.hostname}:8000`;
// Who answers a card, as the ledger records it (decision.approved_by). A fixed English name rather
// than a screen word: the ledger keeps it whatever language the page is in.
const APPROVER = "human controller";

// Every value on this page goes through safe(). A card's reason carries notice names a model wrote —
// model output running as markup on the page where a person confirms it would make the gate no gate.
const safe = value => String(value ?? "").replace(/[&<>"']/g,
  ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[ch]);

// Screen words. Both languages have the same keys; the choice is shared with the map (skynet-lang).
const TEXT = {
  en: {
    title:"sky-net — manual approval", model:"model", rules:"rules", rules_no_key:"rules (no key)",
    tagline:"same seed · same agent code · different wiring", map_link:"open the map",
    guarded_title:"The world that goes through the runtime", guarded_sub:"agents only file",
    direct_title:"The world that drives the autopilot directly", direct_sub:"most wiring today",
    inbox_title:"Awaiting a person", ledger_title:"Ledger", events_title:"What happened",
    none:"none", nothing_yet:"nothing yet",
    pad_conflicts:"Landing pad collisions", post_recall_violations:"Banned acts after a recall",
    weather_hold_takeoffs:"Takeoffs during a weather hold", incident_incursions:"Flights into an incident scene",
    unapproved_passenger_actions:"Unapproved passenger acts", unrecorded_actions:"Acts with no record",
    batteries_dead:"Stopped on a dead battery",
    fleet_spend:"Fleet spend (cap $%s)", human_approvals:"Approved by a person",
    act_publish_notice:"airspace notice (applies only once a person confirms)",
    act_publish_weather:"weather report (takeoffs stop only once a person confirms)",
    act_lift_weather_hold:"lift the weather hold (approve: now; refuse: when the window closes)",
    act_lost_link_notice:"lost-link notice (a person decides whether the held space stays or is released)",
    recorded:"recorded · not a live search", blast:"blast radius %s", approve:"Approve", refuse:"Refuse",
    b_recall:"Recall notice (tick %s) — no fast charging for dv-x500. The left column refuses from the moment the notice arrives; the right one follows only as each aircraft checks for itself.",
    b_hold:"%s — takeoffs held until tick %s (%s). The card below lifts it early.",
    by_human:"confirmed by a person", by_grammar:"read by the rule grammar",
    b_incident:"%s — %s m keep-out until tick %s%s.", incident_held:" (waiting for a person)",
    b_lost:"%s lost its link (since tick %s) — the filed space stays reserved.",
  },
  ko: {
    title:"sky-net — 수동 승인", model:"모델", rules:"규칙 기반", rules_no_key:"규칙 기반 (키 없음)",
    tagline:"같은 씨앗 · 같은 에이전트 코드 · 다른 배선", map_link:"지도로 보기",
    guarded_title:"런타임을 거치는 세계", guarded_sub:"에이전트는 신청만",
    direct_title:"조종장치를 직접 만지는 세계", direct_sub:"오늘 대부분의 배선",
    inbox_title:"승인 대기", ledger_title:"기록", events_title:"무슨 일이 있었나",
    none:"없음", nothing_yet:"아직 없음",
    pad_conflicts:"착륙 패드 충돌", post_recall_violations:"리콜 이후 금지 행동",
    weather_hold_takeoffs:"기상 대기 중 이륙", incident_incursions:"사고 현장 진입",
    unapproved_passenger_actions:"승객 영향 무단 실행", unrecorded_actions:"기록 없는 실행",
    batteries_dead:"방전으로 멈춤",
    fleet_spend:"기단 지출 (한도 $%s)", human_approvals:"사람이 승인한 건",
    act_publish_notice:"공역 공지 (사람이 확인해야 걸림)",
    act_publish_weather:"날씨 보고서 (사람이 확인해야 이륙 정지)",
    act_lift_weather_hold:"기상 대기 풀기 (승인하면 지금, 거부하면 창이 닫힐 때까지)",
    act_lost_link_notice:"링크 두절 통보 (잡아 둔 공간을 유지할지 풀지 사람이 정함)",
    recorded:"녹음본 · 지금 검색한 것 아님", blast:"영향 %s", approve:"승인", refuse:"거부",
    b_recall:"리콜 공지 (tick %s) — dv-x500 급속충전 금지. 왼쪽은 공지가 들어온 순간부터 거부되고, 오른쪽은 기체마다 따로 확인해서 따릅니다.",
    b_hold:"%s — 틱 %s 까지 이륙 정지 (%s). 일찍 풀려면 아래 카드.",
    by_human:"사람이 확인", by_grammar:"규칙 문법이 읽음",
    b_incident:"%s — 반경 %s m 접근 금지, 틱 %s 까지%s.", incident_held:" (사람 확인 대기)",
    b_lost:"%s 링크 두절 (틱 %s 부터) — 낸 경로의 공간은 그대로 잡아 둡니다.",
  },
};

let lang = "en";
try { lang = localStorage.getItem("skynet-lang") || "en"; } catch (error) { void error; }
function t(key, ...args){
  const raw = TEXT[lang]?.[key] ?? TEXT.en[key] ?? key;
  return args.reduce((text, value) => text.replace("%s", value), raw);
}

const ROWS = ["pad_conflicts", "post_recall_violations", "weather_hold_takeoffs", "incident_incursions",
              "unapproved_passenger_actions", "unrecorded_actions", "batteries_dead"];
// Briefing ledger rows are runtime events, not decisions, and about half the ledger. The map's
// briefing panel shows them.
const BRIEFING_ROWS = new Set(["briefing_run", "briefing_item", "briefing_rule"]);

// The action on a card, in one line — a person must see at a glance what they are deciding. What came
// from outside the runtime's own feeds (search, manual input) and what a model read become rules only
// once a person confirms.
function actionWord(action){
  return `act_${action}` in TEXT.en ? t(`act_${action}`) : action;
}

function drawMap(canvas, snap){
  const ratio = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w*ratio){ canvas.width = w*ratio; canvas.height = h*ratio; }
  const g = canvas.getContext("2d");
  g.setTransform(ratio,0,0,ratio,0,0);
  g.clearRect(0,0,w,h);
  const X = x => x/100*w, Y = y => y/60*h;

  const occupancy = {};
  Object.values(snap.assets).forEach(v => {
    if (["landed","charging"].includes(v.state) && v.assigned_pad)
      (occupancy[v.assigned_pad] = occupancy[v.assigned_pad] || []).push(v.id);
  });

  Object.entries(snap.pads).forEach(([name,[px,py]]) => {
    const crowded = (occupancy[name]||[]).length > 1;
    g.strokeStyle = crowded ? "#e2703a" : "#2b3a44";
    g.lineWidth = crowded ? 2.5 : 1.5;
    g.beginPath(); g.arc(X(px), Y(py), 15, 0, 7); g.stroke();
    g.fillStyle = crowded ? "#e2703a" : "#5c6f7a";
    g.font = "11px sans-serif"; g.textAlign = "center";
    g.fillText(name.replace("pad:",""), X(px), Y(py)+4);
  });

  Object.values(snap.assets).forEach(v => {
    const dead = v.state === "grounded", stuck = v.state === "stranded";
    g.fillStyle = dead ? "#5a3232" : stuck ? "#e8b03a" : v.kind === "drone" ? "#18b3a6" : "#7fb3d5";
    g.beginPath(); g.arc(X(v.x), Y(v.y), 6, 0, 7); g.fill();
    g.fillStyle = "#9fb0bb"; g.font = "10px sans-serif"; g.textAlign = "left";
    g.fillText(`${v.id} ${v.battery.toFixed(0)}%`, X(v.x)+9, Y(v.y)+3);
  });
}

function scoreTable(el, snap){
  const s = snap.scoreboard;
  const over = s.over_fleet_limit_usd > 0;
  const rows = ROWS.map(key => {
    const value = s[key];
    return `<tr><td>${t(key)}</td><td class="${value?'hit':'zero'}">${value}</td></tr>`;
  }).join("");
  el.innerHTML = rows +
    `<tr><td>${t("fleet_spend", snap.fleet_limit)}</td>
         <td class="${over?'hit':'zero'}">$${s.spend_usd.toFixed(0)}</td></tr>` +
    `<tr><td>${t("human_approvals")}</td><td class="idle">${s.human_approvals}</td></tr>`;
}

// A notice from a recording (a hand-written briefing scene or an answer saved earlier). Looking like a
// notice searched today, it would get a person to approve a fake notice — the card says so.
const recordedCard = p => Boolean(p.params?.notice?.citation?.recorded);

function inbox(pending){
  const el = document.getElementById("inbox");
  if (!pending.length){ el.innerHTML = `<div class="empty">${t("none")}</div>`; return; }
  const recorded = ` · <span class="rec">${t("recorded")}</span>`;
  el.innerHTML = pending.map(p => `
    <div class="card">
      <div><b>${safe(p.asset_id)}</b> · ${safe(actionWord(p.action))}${recordedCard(p) ? recorded : ""} · $${Number(p.cost_usd || 0).toFixed(0)} · ${t("blast", safe(p.blast_radius))}</div>
      <div class="why">${safe(p.rationale || "")}</div>
      <button class="ok" data-ok="${safe(p.id)}">${t("approve")}</button>
      <button class="no" data-no="${safe(p.id)}">${t("refuse")}</button>
    </div>`).join("");
}

document.addEventListener("click", async e => {
  const ok = e.target.dataset?.ok, no = e.target.dataset?.no;
  if (!ok && !no) return;
  await fetch(`${RT}/${ok ? "approve" : "deny"}`, {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({proposal_id: ok || no, actor:APPROVER})
  });
});

// The latest data, so a language switch redraws at once.
let last = null;

function applyLanguage(){
  document.title = t("title");
  if (document.documentElement) document.documentElement.lang = lang;
  for (const element of (document.querySelectorAll?.("[data-t]") || []))
    element.textContent = t(element.dataset.t);
  for (const button of (document.querySelectorAll?.("[data-lang]") || []))
    button.className = button.dataset.lang === lang ? "on" : "";
  render();
}
for (const button of (document.querySelectorAll?.("[data-lang]") || [])){
  button.addEventListener("click", () => {
    lang = button.dataset.lang;
    try { localStorage.setItem("skynet-lang", lang); } catch (error) { void error; }
    applyLanguage();
  });
}

async function refresh(){
  try{
    const [cmp, rt] = await Promise.all([
      fetch(`${SIM}/compare`).then(r=>r.json()),
      fetch(`${RT}/state`).then(r=>r.json()).catch(()=>null)
    ]);
    last = {cmp, rt};
    render();
  }catch(err){ /* the services may still be starting */ }
}

function render(){
  const none = `<div class="empty">${t("none")}</div>`;
  const llm = document.getElementById("llm");
  if (!last){
    llm.textContent = t("rules");
    document.getElementById("inbox").innerHTML = none;
    document.getElementById("events").innerHTML = none;
    return;
  }
  const {cmp, rt} = last;
  document.getElementById("tick").textContent = cmp.tick;
  for (const name of ["guarded","direct"]){
    const snap = cmp.worlds[name];
    drawMap(document.getElementById(`map-${name}`), snap);
    scoreTable(document.getElementById(`score-${name}`), snap);
  }
  const events = cmp.worlds.direct.events;
  document.getElementById("events").innerHTML = events.length
    ? events.map(e=>`<div><b>${safe(e.kind)}</b> · ${safe(e.text)} <span>(${safe(e.tick)})</span></div>`).join("")
    : none;

  const banner = document.getElementById("recall");
  const notes = [];
  if (cmp.recall_tick != null) notes.push(t("b_recall", safe(cmp.recall_tick)));
  // Rules from information intake. A weather hold stops takeoffs (aircraft in the air land); an
  // incident closes everything within its radius.
  const hold = rt?.weather?.hold;
  if (hold) notes.push(t("b_hold", safe(hold.reason), safe(hold.until_tick),
                         t(hold.source === "human" ? "by_human" : "by_grammar")));
  for (const inc of rt?.incidents || [])
    notes.push(t("b_incident", safe(inc.name), Math.round(Number(inc.radius_m) || 0), safe(inc.until_tick),
                 inc.held ? t("incident_held") : ""));
  // Aircraft with a lost link. Without telemetry, the space of the route it filed stays reserved —
  // its card is in the inbox below.
  for (const [id, link] of Object.entries(rt?.links || {}))
    if (link?.status === "lost")
      notes.push(t("b_lost", safe(id), safe(link.since_tick ?? link.last_seen_tick ?? "—")));
  banner.style.display = notes.length ? "block" : "none";
  banner.innerHTML = notes.join("<br>");   // every piece already went through safe()

  if (!rt){ llm.textContent = t("rules"); return; }
  // The first model that is set. The local stand-in leaves nano empty and sets only super, so [0] was blank.
  llm.textContent = rt.llm.enabled ? String(Object.values(rt.llm.models || {}).find(Boolean) || "") : t("rules_no_key");
  inbox(rt.awaiting_human || []);
  const tail = (rt.ledger || [])
    .filter(e => e.outcome !== "pending" && !BRIEFING_ROWS.has(e.proposal?.action)).slice(0,12);
  document.getElementById("ledger").innerHTML = tail.length
    ? tail.map(e => {
        const p = e.proposal, d = e.decision;
        const who = d.approved_by ? ` · ${safe(d.approved_by)}` : "";
        const arb = d.arbiter ? ` · ${safe(d.arbiter)}` : "";
        return `<div><b>${safe(p.asset_id)}</b> ${safe(p.action)} → ${safe(d.verdict)}${who}${arb}
                <span> · ${safe(d.reason)}</span></div>`;
      }).join("")
    : `<div class="empty">${t("nothing_yet")}</div>`;
}

applyLanguage();
refresh(); setInterval(refresh, 500);
</script>
</body>
</html>
