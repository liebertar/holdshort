function draw(){
  requestAnimationFrame(draw);
  const now = performance.now();
  expireDenials(now);
  const ribbons = [];
  const staged = drawStages(now, ribbons);
  directorTick(now);
  if (!latest){
    map.getSource("flightpath")?.setData({type:"FeatureCollection", features:ribbons});
    return;
  }
  const labels = [], craft = [], cargo = [];
  // Where each aircraft was drawn this frame. The runtime links and the model-trace card use the same spot.
  const drawn = new Map();
  let anyLost = false;
  for (const v of Object.values(latest.worlds.guarded.assets)){
    const m = motion.get(v.id);
    if (!m) continue;
    const point = motionPoint(m, now, POLL_MS);
    const ahead = motionPoint(m, now + 16, POLL_MS);
    const heading = point[0] === ahead[0] && point[1] === ahead[1] ? v.heading ?? 0 :
      Math.atan2((ahead[0] - point[0]) * Math.cos(point[1] * Math.PI / 180),
        ahead[1] - point[1]) * 180 / Math.PI;
    // A lost link. The runtime keeps the space this aircraft filed, so its corridor stays too.
    const lost = linkLost(v.id);
    if (!staged.growing.has(v.id) && m.curve?.coordinates.length > 1 &&
        (v.route?.length || lost || now < m.at + POLL_MS)){
      // Erase what has been flown. Only the rest of the route is still cleared, and a fully drawn
      // line would not show how far the aircraft has come.
      const span = Math.max(0, Math.min(1, (now - m.at) / POLL_MS));
      const flown = m.from + (m.to - m.from) * span;
      const total = m.curve.progress.at(-1);
      if (total - flown > 1e-9){
        corridorAlpha(v.id, 1);
        for (const piece of [...curveColumns(m.curve, flown, total), ...curveRibbon(m.curve, flown, total)])
          ribbons.push(extrusion(piece, {asset:v.id, phase:"approved"}));
        // A reserved corridor whose aircraft went dark gets a pulsing shell. The dashes stay — the
        // reservation holds.
        if (lost){
          anyLost = true;
          for (const piece of curveShell(m.curve, flown, total))
            ribbons.push(extrusion(piece, {asset:v.id, phase:"shell"}));
        }
      }
    }
    // The altitude it will fly: the approved route's altitude, shown on the ground too once cleared.
    // Route and altitude together are what make a clearance readable.
    const cruise = v.route?.length ? Number(v.route[0].alt_m) : Number(v.alt_m) > 1 ? Number(v.alt_m) : null;
    const altitudeWord = cruise === null ? "" : `↑ ${Math.round(cruise)} m`;
    labels.push({
      type:"Feature",
      geometry:{type:"Point", coordinates:point},
      properties:{id:v.id, heading,
        // When stopped to do something, say what and how much is left. A lost link comes first.
        work: lost ? t("lost_link") : workLabel(v),
        tone: lost ? "#ff9d95" : TONE[v.state] || "#c8d4de",
        // Second line: the model flying it · the altitude. No model means rules fly it, and it says so.
        sub: [agentName(v.id), altitudeWord].filter(Boolean).join(" · ")},
    });
    const altitude = roofLifted(point[1], point[0], Number(v.alt_m ?? 0));
    drawn.set(v.id, {lat:point[1], lon:point[0], alt_m:altitude});
    for (const part of droneBody(point[1], point[0], altitude, heading))
      craft.push(extrusion(part, {id:v.id}));
    for (const box of cargoStack(point[1], point[0], altitude, Number(v.load) || 0))
      cargo.push(extrusion(box, {}));
  }
  map.getSource("guarded")?.setData({type:"FeatureCollection", features:labels});
  map.getSource("flightpath")?.setData({type:"FeatureCollection", features:ribbons});
  map.getSource("craft")?.setData({type:"FeatureCollection", features:craft});
  map.getSource("cargo")?.setData({type:"FeatureCollection", features:cargo});
  // The outline is thin rails, so it must be stronger than the slabs to show: it breathes between
  // .25 and .85 once every 1.6 s.
  shellAlpha(anyLost ? .25 + .6 * Math.abs(Math.sin(now / 500)) : 0);
  drawSignals(now, drawn);
  drawPx4(now);
  followTrace(drawn);
  placeRuntimeLabel();
}

/** Brightness of the lost-link shells. One layer, so several dark aircraft breathe together. */
let shellLevel = -1;
function shellAlpha(value){
  if (!map.getSource("flightpath")) return;
  const opacity = Math.round(value * 40) / 40;
  if (!map.getLayer?.("flightpath-shell"))
    map.addLayer({id:"flightpath-shell", type:"fill-extrusion", source:"flightpath",
      filter:["==",["get","phase"],"shell"],
      paint:{"fill-extrusion-color":"#ff3b30", "fill-extrusion-base":["get","base"],
        "fill-extrusion-height":["get","height"], "fill-extrusion-opacity":opacity,
        "fill-extrusion-opacity-transition":{duration:0}}}, "blocker");
  else if (shellLevel !== opacity) map.setPaintProperty("flightpath-shell", "fill-extrusion-opacity", opacity);
  shellLevel = opacity;
}

/** Does /state.links say this aircraft is dark? Without the field (an older runtime) nobody is. */
function linkLost(id){
  return lastRuntime?.links?.[id]?.status === "lost";
}

/** Display name of the model flying an aircraft: /state.agents' display, else the trimmed model id.
 * With neither, rules fly it, and it says so. */
function agentName(id){
  const agent = lastRuntime?.agents?.[id];
  return agent ? asModelName(agent.display || modelName(agent.model)) : t("model_rules");
}
/** The runtime writes "rules" as a placeholder, not a model id: say it in the reader's language. */
function asModelName(name){
  return !name || /^rules$/i.test(name) ? t("model_rules") : name;
}
/** "nvidia/nemotron-3-super-120b-a12b" → "Nemotron Super 120B". The generation number and the
 * active-parameter tail mean nothing on screen. An unknown id keeps its words, capitalised. */
function modelName(raw){
  const id = String(raw || "").split("/").at(-1);
  if (!id) return "";
  const words = id.split(/[-_:.\s]+/).filter(w => w && !/^\d+$/.test(w) && !/^a\d+b$/i.test(w));
  return words.map(w => /^\d+(\.\d+)?[bm]$/i.test(w) ? w.toUpperCase()
                          : w[0].toUpperCase() + w.slice(1)).join(" ");
}

/** Is the point inside the ring? Even-odd crossings — enough to pick one footprint. */
function insideRing(ring, lon, lat){
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++){
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
/** Shortest distance (m) from the point to the ring's edges. Picks the building beside when none is underneath. */
function ringGapM(ring, lon, lat){
  const scale = Math.cos(lat * Math.PI / 180) || 1;
  const px = lon * scale, py = lat;
  let best = Infinity;
  for (let i = 0; i < ring.length - 1; i++){
    const ax = ring[i][0] * scale, ay = ring[i][1], bx = ring[i + 1][0] * scale, by = ring[i + 1][1];
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    const u = len2 > 0 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2)) : 0;
    best = Math.min(best, Math.hypot(px - (ax + u * dx), py - (ay + u * dy)) * 111320);
  }
  return best;
}
/** Ring area (relative, in degrees). Only used to pick the largest of several nearby buildings. */
function ringArea(ring){
  let twice = 0;
  for (let i = 0; i < ring.length - 1; i++)
    twice += ring[i][0] * ring[i + 1][1] - ring[i + 1][0] * ring[i][1];
  return Math.abs(twice) / 2;
}
/** Display altitude of an aircraft standing on a roof bay. Simulator altitude is above ground, so it
 * looked buried in the roof (9 m). Within 12 m of a bay and below the roof, it is drawn 0.8 m above
 * the roof. Once flying, the altitude is used as is. */
function roofLifted(lat, lon, altM){
  const seats = latest?.worlds?.guarded?.seat_coords || [];
  for (const seat of seats){
    const ground = Number(seat.ground_m) || 0;
    if (!ground || altM >= ground + 0.8) continue;
    const dLat = (lat - seat.lat) * 111320, dLon = (lon - seat.lon) * 111320 * Math.cos(lat * Math.PI / 180);
    if (Math.hypot(dLat, dLon) <= 12) return ground + 0.8;
  }
  return altM;
}
let depotPainted = false;
// Tried on every snapshot: the page redraws every frame, so the map is never idle. It paints once
// the tiles are drawn with the warehouse and all bays on screen, and then stops.
function paintDepotBuilding(){
  if (depotPainted || !map.getLayer?.("apartments") || !map.queryRenderedFeatures) return;
  const world = latest?.worlds?.guarded;
  const depot = world?.depot_coords;
  if (!depot) return;
  // Buildings under the depot marker and the four bays. The bays sit in a row on the warehouse roof,
  // so those buildings are the warehouse.
  const spots = [depot, ...(world.seat_coords || [])];
  const canvas = map.getCanvas();
  const hits = new Map();
  let offscreen = 0;
  for (const spot of spots){
    const point = map.project([spot.lon, spot.lat]);
    if (!(point.x >= 0 && point.y >= 0 && point.x <= canvas.clientWidth && point.y <= canvas.clientHeight)){
      offscreen += 1;
      continue;
    }
    const layers = map.getLayer("footprints") ? ["footprints"] : ["apartments"];
    // Under the point, else within 40 px — so a bay standing in a yard picks the building beside it.
    const found = map.queryRenderedFeatures(point, {layers});
    if (!found.length)
      found.push(...map.queryRenderedFeatures([[point.x - 40, point.y - 40], [point.x + 40, point.y + 40]], {layers}));
    for (const hit of found) hits.set(hit.id ?? JSON.stringify(hit.geometry.coordinates[0][0]), hit);
  }
  if (!hits.size) return;
  // One tile building can be a whole complex (a multipolygon). Paint only the parts the depot or a
  // bay actually stands on; with none (a bay in a yard), just the nearest one.
  const features = [], candidates = [];
  for (const hit of hits.values()){
    const polygons = hit.geometry.type === "MultiPolygon" ? hit.geometry.coordinates
      : hit.geometry.type === "Polygon" ? [hit.geometry.coordinates] : [];
    for (const polygon of polygons){
      const feature = {type:"Feature", geometry:{type:"Polygon", coordinates:polygon},
        properties:{height:Number(hit.properties?.render_height) || 10,
                    base:Number(hit.properties?.render_min_height) || 0}};
      if (spots.some(spot => insideRing(polygon[0], spot.lon, spot.lat))) features.push(feature);
      else candidates.push({feature, gap:ringGapM(polygon[0], depot.lon, depot.lat), area:ringArea(polygon[0])});
    }
  }
  if (!features.length){
    // The largest building within 60 m of the marker. The nearest one was the shed beside the warehouse.
    const beside = candidates.filter(c => c.gap <= 60).sort((a, b) => b.area - a.area)[0];
    if (beside) features.push(beside.feature);
  }
  if (!features.length) return;
  map.getSource("depot-building")?.setData({type:"FeatureCollection", features});
  map.setLayoutProperty("depot-marker", "visibility", "none");
  depotPainted = offscreen === 0;
}

function extrusion(piece, properties){
  // Heights must be numbers. A null reaching the style expression (["get","height"]) makes MapLibre warn.
  const number = value => (Number.isFinite(Number(value)) ? Number(value) : 0);
  return {type:"Feature", properties:{...properties, base:number(piece.base), height:number(piece.height), column:!!piece.column},
          geometry:{type:"Polygon", coordinates:[piece.polygon]}};
}

async function getJSON(url){
  const response = await fetch(url, {signal:AbortSignal.timeout(3000)});
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return response.json();
}

async function poll(){
  const started = performance.now();
  try {
    // The simulator's /compare is still the snapshot: besides the round it carries the posted
    // bulletins and where a dark aircraft really is (truth). Its /state has neither. The direct
    // world /compare also carries is never read.
    const [sim, rt] = await Promise.allSettled([
      getJSON(`${SIM}/compare`), getJSON(`${RT}/state`),
    ]);
    if (sim.status === "fulfilled"){
      lastRuntime = rt.status === "fulfilled" ? rt.value : null;
      renderSnapshot(sim.value, lastRuntime);
    }
    else if (rt.status === "fulfilled") {
      renderFeed(rt.value);
      renderDenials(rt.value, performance.now());
      renderAdvisories(rt.value, performance.now());
      renderLinks(rt.value);
      renderBriefing(rt.value);
    }
  } catch (error) { console.error("map refresh failed", error); }
  finally { setTimeout(poll, Math.max(0, POLL_MS - (performance.now() - started))); }
}

function renderSnapshot(data, runtime){
  lastRuntime = runtime || lastRuntime;   // provenance (tierOf) reads the model list from here
  if (latest && (data.round !== latest.round || data.tick < latest.tick)){
    motion.clear(); flights.clear(); stages = []; queued.clear(); seenDenials.clear();
    seenAdvisories.clear(); advisoryUntil = 0;
    denialUntil = 0; roundStartedAt = Date.now() / 1000;
    map.getSource("flightpath")?.setData(empty());
    // Link events and director scenes start over each round — last round's events must not fly again.
    signalEvents = []; signalSeen.clear(); telemetryDotAt.clear(); signalBuiltAt = -Infinity;
    resetDirector(); hideTrace();
  }
  latest = data;
  document.getElementById("round-tick").textContent = t("round_tick", data.round ?? "—", data.tick);

  const now = performance.now();
  // Only the runtime's world is drawn. /compare also carries the direct world; the map never reads it.
  for (const v of Object.values(data.worlds.guarded.assets)){
    const previous = motion.get(v.id);
    const route = v.route || [];
    let flight = flights.get(v.id);
    if (route.length && (!flight || !isRemainingRoute(flight.remaining, route))){
      flight = {curve:makeCurve({...v, alt_m:roofLifted(v.lat, v.lon, Number(v.alt_m ?? 0))}, route),
                remaining:route, progress:0};
      flights.set(v.id, flight);
    }
    if (flight){
      const to = routeProgress(flight.curve, v, flight.progress);
      const from = previous?.curve === flight.curve
        ? previous.from + (previous.to - previous.from) * Math.min(1, (now - previous.at) / POLL_MS)
        : to;
      motion.set(v.id, {curve:flight.curve, from, to, at:now});
      flight.progress = to;
      flight.remaining = route;
      if (!route.length) flights.delete(v.id);
    } else {
      motion.set(v.id, {start:previous ? motionPoint(previous, now, POLL_MS) : [v.lon,v.lat],
        end:[v.lon,v.lat], at:now});
    }
  }

  // The real FAA grid. The lower the ceiling the redder; forbidden cells solid, without hatching.
  // Cells of one class come merged, so it does not read as a grid.
  const bands = data.worlds.guarded.bands || [];
  map.getSource("cells")?.setData({type:"FeatureCollection", features: bands.map(b => {
    const rings = (b.rings || [b.polygon]).map(closedRing);
    return {
      type:"Feature",
      geometry:{type:"MultiPolygon", coordinates: rings.map(r => [r])},
      properties:{name:b.name, rule:b.rule, ceiling: b.ceiling_m == null ? 0 : b.ceiling_m},
    };
  })});

  // Draw the exact polygon the runtime enforces. A circle drawn here once sat somewhere other than
  // the real forbidden zone. Notice zones the runtime has applied are painted too (applied only — a
  // held one blocks nothing), just once when the simulator knows the same id.
  const zone = data.worlds.guarded.zone;
  const zoneFeatures = zone?.active && zone.polygon?.length
    ? [{type:"Feature", properties:{id:zone.id, name:zone.name || zone.id},
        geometry:{type:"Polygon", coordinates:[closedRing(zone.polygon)]}}]
    : [];
  for (const n of (runtime?.notices || [])){
    if (!n.applied || !(n.polygon?.length > 2) || (zone?.active && n.id === zone.id)) continue;
    // Briefing cranes and closures have their own shapes (amber mast, grey landing area); a red
    // circle as well would say it twice.
    if (n.kind === "crane" || n.kind === "closure") continue;
    zoneFeatures.push({type:"Feature", properties:{id:n.id, name:n.name || n.id},
      geometry:{type:"Polygon", coordinates:[closedRing(n.polygon)]}});
  }
  // What the runtime briefing applied. Events and restrictions were painted above as notices (with
  // names); cranes stand; closed landing areas go grey.
  const marks = briefingMarks(runtime, data.worlds.guarded);
  map.getSource("zone")?.setData({type:"FeatureCollection", features: zoneFeatures});
  renderCranes(marks);

  const areas = data.worlds.guarded.landing_areas || [];
  const shut = area => marks.closed.get(area.id) ?? marks.closed.get(area.name);
  map.getSource("landing")?.setData({type:"FeatureCollection", features: areas.map(a => ({
    type:"Feature", geometry:{type:"Point", coordinates:[a.lon, a.lat]},
    properties:{name:a.name, closed:shut(a) !== undefined,
                tag:shut(a) !== undefined ? t("bf_closed", shut(a)) : t("lg_landing")}}))});
  map.getSource("landing-disc")?.setData({type:"FeatureCollection", features: areas.map(a => ({
    type:"Feature", geometry:{type:"Polygon", coordinates:[groundDisc(a.lat, a.lon, 30)]},
    properties:{name:a.name, closed:shut(a) !== undefined}}))});

  const depot = data.worlds.guarded.depot_coords;
  map.getSource("depot")?.setData({type:"FeatureCollection", features:depot ? [{
    type:"Feature", geometry:{type:"Point", coordinates:[depot.lon,depot.lat]}, properties:{},
  }] : []});
  map.getSource("seats")?.setData({type:"FeatureCollection",
    features:(data.worlds.guarded.seat_coords || []).map((seat, index) => ({
      type:"Feature", geometry:{type:"Polygon", coordinates:[groundDisc(seat.lat, seat.lon, 7)]},
      properties:{name:seat.asset ? `${t("lg_bay", index + 1)} · ${seat.asset}` : t("lg_bay", index + 1),
                  base:Number(seat.ground_m) || 0, height:(Number(seat.ground_m) || 0) + 0.4}}))});

  if (runtime) {
    renderFeed(runtime); renderDenials(runtime, now); renderAdvisories(runtime, now); renderLinks(runtime);
    renderBriefing(runtime); renderAutopilots(runtime, now);
    // Link events come from the ledger (filing, verdict, recall, telemetry). After renderDenials so
    // their timing matches the replayed stages.
    spawnSignals(runtime, now);
    directorFeed(data, runtime, now);
    if (traceTarget?.from === "aircraft") showTraceFor(traceTarget.asset, traceTarget.point);
  }
  renderRuntime();
  paintDepotBuilding();
  renderLegend(data, zoneFeatures.length > 0, marks);

  // Notices in force: which rule arrived when, and what it blocks. Notices arrive as prose. What the
  // runtime read into a zone (notices) shows as such; prose not yet read shows as it came — whether
  // it was read at all must be visible.
  const banner = document.getElementById("banner");
  const bulletins = data.bulletins || [];
  // Applied, waiting for a person, and confirmed by a person but not yet in its window. Without the
  // last, a confirmed notice showed as "not yet read". Notices from the briefing (with a citation)
  // are told by the briefing card with their source — not again on the banner.
  const notices = (runtime?.notices || [])
    .filter(n => !n.citation && (n.applied || n.held || n.source === "human"));
  const known = new Set(notices.map(n => n.id));
  const lines = notices.map(n => noticeLine(n, runtime));
  // Weather. A hold in force is policy (/state.weather.hold); a report a model read, still waiting
  // for a person, blocks nothing yet.
  const weather = runtime?.weather || {};
  if (weather.hold) lines.push(t("b_weather", safe(holdWhy(weather.hold.reason)), weather.hold.until_tick,
                                noticeSource(weather.hold.source)));
  for (const held of weather.held || [])
    lines.push(t("b_weather_held", safe((held.breaches || []).join(" · ")), noticeSource(held.source)));
  // Intake items that were read. A simulator weather or incident text missing here is unread, and
  // unread text shows as it came.
  const intake = runtime?.intake?.items || [];
  const read = new Set(intake.filter(i => i.kind).map(i => i.id));
  if (weather.hold) read.add(weather.hold.id);
  for (const b of bulletins){
    if (b.kind === "zone") lines.push(t("b_zone", b.published_tick, b.until_tick, b.name || b.id));
    else if (b.kind === "notam"){
      if (!known.has(b.id)) lines.push(t("b_notam_raw", b.published_tick, b.until_tick, safe(b.text || b.id)));
    } else if (b.kind === "weather" || b.kind === "incident"){
      if (!read.has(b.id) && !known.has(b.id))
        lines.push(t(b.kind === "weather" ? "b_weather_raw" : "b_incident_raw", b.published_tick, b.until_tick, safe(b.text || b.id)));
    } else lines.push(t("b_recall", b.published_tick, b.until_tick, b.applies_to?.model || b.id));
  }
  for (const item of intake.filter(i => !i.kind && i.why).slice(-3))
    lines.push(t("b_intake_raw", safe(item.text || item.id), safe(item.why)));
  banner.hidden = !lines.length;
  banner.innerHTML = panelBar("banner", "notices_title") + lines.map(line => `<div>${line}</div>`).join("");
}

/** Legend. Only what is on screen gets a row — no grid loaded, no ceiling colours. */
function renderLegend(data, zoned, marks = {cranes:[], closed:new Map()}){
  const legend = document.getElementById("legend");
  if (!legend) return;
  legendArgs = [data, zoned, marks];   // L redraws just these rows when it toggles the links
  const world = data.worlds?.guarded || {};
  // One item = one unbreakable unit; rows wrap only between items. Forced onto one line, warehouse +
  // landing area + closed zone overflowed the card (300) and were cut to "Closed zo".
  const item = inner => `<span class="li">${inner}</span>`;
  const key = (cls, word) => item(`<span class="route-key ${cls}"></span>${word}`);
  const swatch = (colour, word) => item(`<span class="k" style="background:${colour}"></span>${word}`);
  const row = items => `<div>${items.join("")}</div>`;
  const rows = [row([key("pending", t("lg_pending")), key("", t("lg_ok")), key("denied", t("lg_no"))])];
  const lost = Object.values(lastRuntime?.links || {}).some(l => l?.status === "lost");
  rows.push(row([swatch("var(--zone)", t("lg_block")), ...(lost ? [key("reserved", t("lg_reserved"))] : [])]));
  const places = [];
  if (world.depot_coords) places.push(swatch("#eee7ce", t("lg_depot")));
  if (world.landing_areas?.length) places.push(swatch("#18b3a6", t("lg_landing")));
  if (zoned) places.push(swatch("#ff3b30", t("lg_zone")));
  if (marks.cranes?.length) places.push(swatch("#ffb020", t("lg_crane")));
  if (marks.closed?.size) places.push(swatch("#5b6770", t("lg_closed")));
  if (px4Motion.size) places.push(swatch("#d9c8ff", t("lg_px4")));
  if (places.length) rows.push(row(places));
  // The runtime and its links (L). The legend names the building the mast stands on — on the map
  // alone the mast reads as part of the building.
  if (signalsOn){
    rows.push(row([swatch("#cfe3ff", t("lg_runtime")), key("signal", t("lg_signal")),
                   ...(lost ? [key("signal-lost", t("lg_signal_lost"))] : [])]));
    rows.push(`<div class="meta">${t("lg_runtime_note", RUNTIME_SITE.name)}</div>`);
  }
  if (world.bands?.length){
    const step = (colour, value) => `<span class="k" style="background:${colour}"></span>${value}`;
    rows.push(row([swatch("#c1121f", t("lg_nofly")), item(`${t("lg_ceil")} ` + [step("#ffb020", "30"),
      step("#d8d92c", "61"), step("#48c06a", "91"), step("#2b8fe0", "122&nbsp;m")].join(" "))]));
    rows.push(`<div class="meta">${t("lg_source")}</div>`);
  }
  legend.innerHTML = panelBar("legend", "legend_title") + rows.join("");
  legend.hidden = !rows.length;
}

/** Lost-link card. One row per dark aircraft — since when, and that its space stays reserved. Gone once restored. */
function renderLinks(runtime){
  const card = document.getElementById("lostlink");
  if (!card) return;
  const lost = Object.entries(runtime?.links || {}).filter(([, l]) => l?.status === "lost");
  card.hidden = !lost.length;
  if (card.dataset) card.dataset.asset = lost[0]?.[0] || "";
  // A newly dark aircraft opens the card again even if it was minimized.
  const fresh = lost.some(([id]) => !lostShown.has(id));
  lostShown = new Set(lost.map(([id]) => id));
  if (fresh) setMinimized("lostlink", false, false);
  card.innerHTML = panelBar("lostlink", "lostlink_title") + lost.map(([id, l]) =>
    `<div class="line1"><span class="tag t-lost">${t("lost_link")}</span><b>${safe(id)}</b>`
    + `<span class="meta">${t("ll_line", l.since_tick ?? l.last_seen_tick ?? "—")}</span></div>`).join("");
}

/** Only the reason from "WEATHER HOLD · gusts 14 m/s > 12"; the banner writes its own heading. */
function holdWhy(reason){
  return String(reason || "").replace(/^WEATHER HOLD\s*·\s*/, "");
}

/** Who read a notice. The ledger keeps the model id; the screen shows one tier word. */
function noticeSource(source){
  const s = String(source || "");
  if (s.startsWith("model:")) return t("src_model", tierOf(s.slice(6)) || t("drafter_model"));
  if (s === "human") return t("src_human");
  return t("src_grammar");
}
function noticeLine(n, runtime){
  const name = safe(n.name || n.id);
  if (n.kind === "incident"){
    // An incident is a circle. /state.incidents carries the radius (the notice list has only the polygon).
    const incident = (runtime?.incidents || []).find(i => i.id === n.id) || {};
    const radius = Math.round(Number(incident.radius_m) || 0);
    if (n.held) return t("b_incident_held", name, radius, noticeSource(n.source));
    if (n.applied) return t("b_incident", name, radius, n.until_tick ?? "∞", noticeSource(n.source));
  }
  if (n.held) return t("b_notam_held", name, noticeSource(n.source));
  if (!n.applied) return t("b_notam_confirmed", n.from_tick ?? "—", n.until_tick ?? "∞", name, noticeSource(n.source));
  return t("b_notam", n.from_tick ?? "—", n.until_tick ?? "∞", name, noticeSource(n.source));
}

const ROUTED = ["fly_route", "reserve_pad"];
// Runtime commands that pull an approved route back from an aircraft.
const PULLED_CODES = new Set(["recalled", "withdrawn"]);
// Briefing rows are about half the ledger. The feed keeps only the newest run, as one neutral line;
// items and rules are listed by the briefing panel.
const BRIEFING_ROWS = new Set(["briefing_run", "briefing_item", "briefing_rule"]);

/** A filing: something an aircraft's agent asked for. Only filings are approved, refused, carded or
 * replayed; rows the runtime wrote itself are events. */
function isFiling(entry){
  return entry.proposal?.author !== "runtime";
}

// Who wrote it and what drew it. The ledger keeps the model id; the screen shows one tier word.
// Nothing marks what rules wrote — no mark means rules.
function tierOf(author, assetId){
  if (!author || author === "rules" || author === "runtime") return "";
  // A filing an aircraft wrote carries the name of the model on that aircraft. Even when the
  // runtime's stand-in has the same id (both 4B locally), a drone line must not say "super" —
  // aircraft never call Super.
  const agent = assetId ? lastRuntime?.agents?.[assetId] : null;
  if (agent?.model && author === agent.model) return shortModel(agent.display || modelName(agent.model));
  const models = lastRuntime?.llm?.models || {};
  const aircraft = Boolean(assetId && (agent || latest?.worlds?.guarded?.assets?.[assetId]));
  if (aircraft)
    return models.nano && author === models.nano ? "nano" : (shortModel(modelName(author)) || t("drafter_model"));
  for (const tier of ["super", "ultra", "nano"])
    if (models[tier] && author === models[tier]) return tier;
  return t("drafter_model");
}
/** A short name for a tag. "Nemotron Nano 4B" → "Nano 4B". */
function shortModel(name){
  return String(name || "").replace(/^Nemotron\s+/i, "");
}
function drafterWord(params, legs){
  const d = String(params?.drafter || "");
  // Code drew the candidates and the model only picked one. Who picked is told by the approval line
  // and the ledger row.
  if (d.startsWith("choice")) return t("drafter_choice");
  if (d.startsWith("nano")) return t("drafter_nano");
  if (d === "astar") return t("drafter_astar");
  if (d === "straight" || (!d && (legs?.length || 0) === 2)) return t("drafter_straight");
  return d ? t("drafter_model") : "";
}
// The approval wording comes from the decision code; "APPROVED · RUNTIME" said nothing. When the
// model picked one of several candidates, who picked what and why is the headline.
function approvedWord(decision, params, asset){
  const chose = choiceWords(params, asset);
  const word = verdictWord(decision, params);
  if (!chose) return word;
  return word === t("r_within_limits") ? chose : `${word} · ${chose}`;
}
function verdictWord(decision, params){
  // An approval that climbs, or waits for another aircraft, because of a crossing names the fix.
  if (params?.resolution === "altitude" && params.altitude_shift_m)
    return t("res_altitude", Math.round(params.altitude_shift_m));
  if (params?.resolution === "delay" && params.holding_for)
    return t("res_delay", params.holding_for);
  const arbiter = decision?.arbiter && String(decision.arbiter).startsWith("ultra") ? " · ultra" : "";
  if (decision?.approved_by) return `${decision.approved_by}${arbiter}`;
  const code = decision?.code || "";
  if (code === "within_limits") return t("r_within_limits") + arbiter;
  if (code === "resource_granted") return t("r_resource_granted", decision.detail?.resource || "") + arbiter;
  return (decision?.reason || t("r_within_limits")) + arbiter;
}
function renderLlmLine(runtime){
  const line = document.getElementById("llm-line");
  if (!line) return;
  const llm = runtime?.llm || {};
  const models = llm.models || {};
  // Which model flies each aircraft: "×4" when they share one, each listed when mixed.
  const counts = new Map();
  for (const agent of Object.values(runtime?.agents || {})){
    const name = asModelName(agent?.display || modelName(agent?.model));
    counts.set(name, (counts.get(name) || 0) + 1);
  }
  const droneModels = [...counts.keys()].some(name => name !== t("model_rules"));
  if (!llm.enabled && !droneModels){
    line.textContent = t("llm_off");
    return;
  }
  // The model the runtime calls and the models the aircraft use are different seats. Locally both
  // are 4B, and on one line it read as if the drones were using Super.
  const runtimeModel = llm.enabled ? (models.super || models.ultra || "") : "";
  const parts = [runtimeModel ? t("runtime_line", runtimeModelName(runtimeModel), llm.host || "api")
                              : t("runtime_rules")];
  if (droneModels)
    parts.push(t("agents_line", [...counts].map(([name, n]) => `${name} ×${n}`).join(" · ")));
  else if (llm.enabled && models.nano)
    parts.push(t("agents_line", modelName(models.nano)));
  line.textContent = parts.join(" · ");
}
/** Name of the model at the runtime's seat. Anything but a real Super or Ultra (a local stand-in) says so. */
function runtimeModelName(id){
  const name = modelName(id);
  return /super|ultra/i.test(id) ? name : t("standin", name);
}

function renderDenials(runtime, now){
  const closed = runtime.ledger.filter(e => e.outcome !== "pending");
  const recent = closed.filter(e => !seenDenials.has(e.id) &&
    e.at >= roundStartedAt && Date.now() - e.at * 1000 < DENIAL_MS);
  // Keep the current ledger window plus staged routes, without unbounded history.
  seenDenials = new Set([...closed.map(e => e.id), ...stages.map(s => s.id)]);
  // The ledger is newest first. Queued as is, an approval would replay before the refusal that came
  // first — re-sort into the order things happened.
  for (const e of [...recent].sort((a, b) => a.at - b.at)) stageRoute(e, now);
  // Not only refusals: a recall needs a person's eye too. A rule arrives and turns back an aircraft
  // already flying on a clearance — the moment it visibly changes course. Only recalls and
  // withdrawals the runtime wrote; weather-hold and incident rows carry policy_hit too, but they
  // belong on the banner.
  const recalled = e => !isFiling(e) && e.decision.policy_hit && PULLED_CODES.has(e.decision.code);
  // Only a filing can be refused. Runtime rows with a denied verdict (a notice it could not read, a
  // failed briefing run) are events, not refusals. A "same request just ran" refusal is not for a
  // person either: it stays in the ledger, never on a card.
  const fresh = recent.filter(e => (isFiling(e) && e.decision.verdict === "denied"
                                    && e.decision.code !== "duplicate") || recalled(e));
  if (!fresh.length) return;
  const e = fresh[0], params = e.proposal.params || {};
  const pulled = recalled(e), withdrawn = e.decision.code === "withdrawn";
  const tag = document.querySelector("#denial .tag");
  tag.textContent = withdrawn ? t("d_withdraw") : pulled ? t("d_recall") : t("d_reject");
  tag.className = pulled ? "tag t-human" : "tag t-deny";
  document.getElementById("denial-who").textContent = e.proposal.asset_id;
  const card = document.getElementById("denial");
  card.className = pulled ? "card pulled" : "card";
  if (card.dataset) card.dataset.asset = e.proposal.asset_id;
  document.getElementById("denial-what").textContent = t(e.proposal.action);
  // Assembled from the values the runtime left; its sentences are never parsed.
  document.getElementById("denial-why").textContent = pulled && !withdrawn
    ? `${t("d_pulled")} — ${reasonText(e)}`
    : reasonText(e);
  const floor = Math.round(Number(params.blocked_floor_m) || 0);
  const top = Math.round(Number(params.blocked_ceiling_m) || 0);
  const source = params.blocked_volume || e.decision.policy_hit || "";
  const notes = [params.blocked_volume && params.blocked_leg ? `${floor}–${top || "∞"} m AGL` : "",
                 source ? t("rule_source", source) : "",
                 fresh.length > 1 ? t("d_more", fresh.length - 1) : ""];
  document.getElementById("denial-more").textContent = notes.filter(Boolean).join(" · ");
  document.getElementById("denial").hidden = false;
  setMinimized("denial", false, false);
  denialUntil = now + DENIAL_MS;
}

/** One option line. The runtime sends only the id and values (until_tick, shift_m); the wording is
 * made here, per language. */
function optionLabel(option){
  const o = option || {};
  const key = `opt_${o.id}`;
  if (!(TEXT.en[key])) return safe(o.label || o.id || "");
  return t(key, o.id === "climb" ? Math.round(Number(o.shift_m) || 30) : o.until_tick ?? "—");
}

/** Runtime advisory card. /state.advisories holds the last one per aircraft, so the ledger id picks out new ones. */
function renderAdvisories(runtime, now){
  const fresh = (runtime?.advisories || []).filter(a => a.ledger_id && !seenAdvisories.has(a.ledger_id)
    && (!roundStartedAt || (a.at ?? 0) >= roundStartedAt) && Date.now() - (a.at ?? 0) * 1000 < ADVISORY_MS);
  for (const a of fresh) seenAdvisories.add(a.ledger_id);
  if (!fresh.length) return;
  const a = fresh.sort((x, y) => (x.at ?? 0) - (y.at ?? 0)).at(-1);
  const card = document.getElementById("advisory");
  if (card.dataset) card.dataset.asset = a.asset;
  document.getElementById("advisory-tag").textContent = t("adv_tag");
  document.getElementById("advisory-who").textContent = a.asset;
  const source = a.source === "super" ? t("adv_src_super") : t("adv_src_rules");
  const count = (a.refusals || []).length;
  document.getElementById("advisory-source").textContent =
    `${source} · ${t(a.trigger === "decline_after_refusals" ? "adv_after_decline" : "adv_after", count)}`;
  const chosen = (a.options || []).find(o => o.id === a.chosen);
  // A summary the model (super) wrote shows as is; a rules pick is assembled in screen words.
  document.getElementById("advisory-summary").textContent = a.source === "super" && a.summary
    ? a.summary
    : t(a.trigger === "decline_after_refusals" ? "adv_template_decline" : "adv_template",
        a.asset, count, optionLabel(chosen || {id:a.chosen}));
  document.getElementById("advisory-options").innerHTML = (a.options || []).map(o =>
    `<li class="${o.legal ? "ok" : "no"}${o.id === a.chosen ? " chosen" : ""}">${optionLabel(o)} · ${
      o.legal ? t("adv_legal") : t("adv_illegal")}${o.why && !o.legal ? ` — ${safe(o.why)}` : ""}</li>`).join("");
  document.getElementById("advisory-note").textContent = t("adv_note");
  card.hidden = false;
  setMinimized("advisory", false, false);
  advisoryUntil = now + ADVISORY_MS;
}

/** Register one closed filing decision as a stage to replay. Coordinates are exactly as filed. */
function stageRoute(entry, now){
  const legs = entry.proposal.params?.legs;
  if (!isFiling(entry) || !ROUTED.includes(entry.proposal.action) || !(legs?.length > 1)) return;
  const decision = entry.decision, verdict = decision.verdict;
  // Something sent to a person (human) has not travelled yet — it is in the ledger now, but must not
  // be drawn as an approval.
  const kind = verdict === "denied" ? "rejected" : verdict === "auto" ? "approved" : null;
  if (!kind) return;   // anything still waiting has not travelled yet
  // Filing the same request twice is not a blocked path. The ledger keeps its waypoints; no replay.
  if (decision.code === "duplicate") return;
  const params = entry.proposal.params || {};
  // One line per aircraft. The next stage starts only once the previous one is gone: yellow line →
  // refused and withdrawn → a new yellow line → approved. They never overlap. The simulator holds
  // the aircraft until this replay ends (CLEARANCE_TICKS).
  const asset = entry.proposal.asset_id;
  const by = approvedWord(decision, params, asset);
  // Replays happen only for departures from the ground. A route changed in flight (a re-route after a
  // recall) belongs to an aircraft already moving; a yellow line redrawn from the old spot would be a
  // second line drifting apart from it. There the corridor simply switches to the new route.
  if (Number(latest?.worlds?.guarded?.assets?.[asset]?.alt_m) > 1) return;
  // The replay falls at most one stage behind real time. With five refusals every 12 s the queue would
  // grow without end and show long-gone events, so the backlog is dropped and the new stage goes right
  // after the one playing.
  const playing = stages.filter(s => s.asset === asset && s.at <= now);
  const playingEnd = Math.max(now, ...playing.map(s => s.at + stageLife(s.kind)));
  const backlog = (queued.get(asset) || 0) - playingEnd;
  if (backlog > 0){
    stages = stages.filter(s => s.asset !== asset || s.at <= now);
    queued.set(asset, playingEnd);
  }
  const at = Math.max(now, queued.get(asset) || 0);
  queued.set(asset, at + stageLife(kind));
  // Only airspace refusals draw what blocked them in place. A held takeoff pad or an airworthiness
  // directive is not a blocked path, so its reason is words only.
  const airspace = decision.code === "airspace";
  stages.push({
    id:entry.id, asset, kind, at, by, params, filed:entry.at,
    reason: airspace ? blockedLabel(params) : reasonText(entry),
    drafter: drafterWord(params, legs),
    curve:makeCurve({...legs[0], alt_m:roofLifted(legs[0].lat, legs[0].lon, Number(legs[0].alt_m ?? 0))},
                    legs.slice(1)),
    blocker: airspace && params.blocked_polygon?.length ? {
      polygon: params.blocked_polygon,
      // Only buildings and cranes have height. Zones and grid cells get 0 → painted on the ground.
      height: tallVolume(params) ? Number(params.blocked_ceiling_m) || 0 : 0,
    } : null,
    breach: airspace && params.blocked_at ? {at: params.blocked_at, params} : null,
  });
}

/**
 * The yellow corridor grows forward, then the same shape only changes colour.
 * During a replay the live corridor is hidden, so each aircraft shows one route.
 */
const PHRASE = {drawing:"ph_drawing", checking:"ph_checking", refused:"ph_refused"};
// Why an aircraft is stopped, written beside it. Nothing is added while flying.
const WORKING = new Set(["dropping", "loading", "picking", "ready", "landing", "charging", "landed",
                         "stranded", "diverted"]);
// One colour per state: loading amber, unloading green, landing blue, charging yellow, waiting near white.
const TONE = {loading:"#ffb84d", picking:"#ffb84d", dropping:"#7ff0ae", ready:"#eef3f7", landing:"#8ec5ff",
              landed:"#cfd8e0", charging:"#ffd23f", cruising:"#c8d4de"};

/** State words beside an aircraft. States with progress carry the number — how many boxes, what battery %. */
function workLabel(v){
  switch (v.state){
    case "loading": return `${t("loading")} ${Number(v.load) || 0}/${CARGO_MAX}`;
    case "dropping": return `${t("dropping")} ${Number(v.load) || 0}`;
    case "picking": return `${t("picking")} ${Number(v.load) || 0}`;
    // Waiting on the ground for clearance, one word only. What is going on is told by the route
    // growing from the aircraft (planning · awaiting verdict · rejected · approved).
    case "ready": return v.holding_for ? t("holding_for", v.holding_for) : t("ready");
    case "charging": return `${t("charging")} ${Math.round(v.battery)}%`;
    // Airborne with no approved route: say what it is waiting for. A bare "holding" does not read.
    case "cruising": return Number(v.alt_m) > 1 && !v.route?.length ? t("awaiting_route") : "";
    case "returning": return t("returning");
    default: return WORKING.has(v.state) ? t(v.state) : "";
  }
}

/** A decision's reason in screen words. The runtime sends only codes and values; the wording is made here. */
function reasonText(entry){
  const d = entry.decision, x = d.detail || {}, params = entry.proposal.params || {};
  switch (d.code || ""){          // a decision without a code uses the runtime's own sentence
    case "airspace": return PLACES.has(params.blocked_kind)
      ? blockedLabel(params) : t("r_airspace", params.blocked_leg, blockedLabel(params));
    case "withdrawn": return t("r_withdrawn", x.for || params.withdrawn_for || "—");
    case "nonconforming": return t("r_nonconforming", params.actual_depart_tick ?? "—",
                                   x.planned_depart_tick ?? params.planned_depart_tick ?? "—");
    case "policy": return String(x.policy || "").startsWith("weather-hold")
      ? t("r_weather_policy", x.until_tick ?? "—") : t("r_policy", x.policy);
    case "intake_received": return t("r_intake_received", x.source || "—");
    case "intake_read": return t("r_intake_read", noticeSource(x.read_by), t(`k_${x.kind}`));
    case "intake_unreadable": return t("r_intake_unreadable", x.why || "");
    case "intake_source_failed": return t("r_intake_source_failed", x.error || "");
    case "intake_source_recovered": return t("r_intake_source_recovered");
    case "weather_hold_closed": return t("r_weather_hold_closed");
    case "weather_hold": return t("r_weather_hold", holdWhy(d.reason), x.until_tick ?? "—");
    case "weather_hold_expired": return t("r_weather_hold_expired", x.until_tick ?? "—");
    case "human_weather": return t("r_human_weather", tierOf(entry.proposal.author) || t("drafter_model"));
    case "incident_keepout": return t("r_incident_keepout", safe(x.name || ""), Math.round(Number(x.radius_m) || 0), x.until_tick ?? "—");
    case "human_action": return t("r_human_action", t(x.action) || x.action);
    case "human_blast": return t("r_human_blast", x.blast);
    case "over_asset": return t("r_over_asset", x.spent, x.cap);
    case "over_fleet": return t("r_over_fleet", x.spent, x.cap);
    case "resource_held": return t("r_resource_held", x.resource, x.holder || "—");
    case "resource_granted": return t("r_resource_granted", x.resource);
    case "recalled": return t("r_recalled", x.resource, x.policy);
    case "advisory": return t("r_advisory", optionLabel((params.options || []).find(o => o.id === x.chosen)
                                                        || {id:x.chosen})) + (x.source === "super" ? " · super" : "");
    case "notice_unreadable": return t("r_notice_unreadable", x.why || "");
    case "link_lost": return t("r_link_lost", x.since_tick ?? x.last_seen_tick ?? params.since_tick ?? "—");
    case "link_restored": return t("r_link_restored");
    case "lost_link_refused": return t("r_lost_link_refused", x.since_tick ?? x.last_seen_tick ?? "—");
    case "briefing_run": return briefingRunText(entry);
    case "briefing_item": return ["unreadable", "invalid"].includes(x.status)
      ? t("r_briefing_unread", safe(x.domain || "—"), safe(x.why || "—"))
      : t("r_briefing_item", t(`bf_kind_${KIND_GLYPH[x.kind] ? x.kind : "info"}`), safe(x.domain || "—"));
    case "briefing_rule": return t(x.held ? "r_briefing_rule_held" : "r_briefing_rule",
                                   safe(entry.proposal.rationale || x.rule || "—"));
    case "notice_published": return t("r_notice_published");
    case "notice_refused": return t("r_notice_refused");
    case "": return d.reason;
    default: return t(`r_${d.code}`);
  }
}

/** "1 page" or "N pages" in English; Korean has no plural, so the dictionary keeps its own shape. */
function pageCount(pages){
  return lang === "ko" ? String(pages) : `${pages} page${pages === 1 ? "" : "s"}`;
}

/** One neutral line for a briefing run: where, how many pages, recorded or live. A failed run says
 * so without ever reading as a refusal. */
function briefingRunText(entry){
  const x = entry.decision.detail || {};
  const places = (Array.isArray(x.places) ? x.places : []).slice(0, 2).join(", ") || x.trigger || "—";
  const recorded = x.source === "recorded" ? t("bf_recorded_note") : "";
  const failed = entry.outcome === "failed" || entry.decision.verdict === "denied";
  return failed ? t("r_briefing_failed", safe(places), recorded)
                : t("r_briefing_run", safe(places), pageCount(Number(x.pages) || 0), recorded);
}

/** What blocked it, in screen words. The runtime sends only values; the wording is made here. */
const ENDPOINTS = new Set(["origin", "destination"]);
// A blocked place rather than a leg. The label is a sentence on its own, so no "leg 3 enters" in front.
const PLACES = new Set(["origin", "destination", "landing", "takeoff", "column", "traffic"]);
function blockedLabel(params){
  const id = params.blocked_volume || "";
  const height = Math.round(Number(params.blocked_ceiling_m) || 0);
  // A rule from the runtime briefing is named with its source — "CRANE 95 m (nyc.gov)".
  const brief = briefingFor(id);
  if (brief){
    const named = briefingLabel(brief, height, params);
    if (params.blocked_kind === "landing") return t("blk_landing", named);
    if (params.blocked_kind === "takeoff") return t("blk_takeoff", named);
    if (params.blocked_kind === "column") return t("blk_column", named);
    return named;
  }
  // Route ends that miss the aircraft or the destination leave a stretch no check covered. The gap
  // blocked it, not an object.
  if (ENDPOINTS.has(params.blocked_kind))
    return t(params.blocked_kind === "origin" ? "blk_origin" : "blk_destination",
             Math.round(Number(params.blocked_gap_m) || 0));
  if (params.blocked_kind === "traffic") return t("blk_traffic", params.blocked_asset || "");
  if (params.blocked_kind === "takeoff" || params.blocked_kind === "column")
    return t(params.blocked_kind === "takeoff" ? "blk_takeoff" : "blk_column",
             id.startsWith("bldg-") ? t("blk_building", height) : params.blocked_name || id);
  if (params.blocked_kind === "landing")
    return t("blk_landing", id.startsWith("bldg-") ? t("blk_building", height)
             : params.blocked_name || id || params.blocked_asset || "");
  if (id.startsWith("bldg-")) return t("blk_building", height);
  if (params.blocked_kind === "ceiling") return t("blk_ceiling", height);
  if (id.startsWith("uasfm-")) return t("blk_grid");
  if (id.startsWith("nofly-")) return t("blk_zone");
  return params.blocked_name || t("blk_other");
}

function drawStages(now, corridors){
  const blockers = [], breaches = [], labels = [];
  const growing = new Set(stages.map(stage => stage.asset));
  for (const stage of stages){
    const elapsed = now - stage.at;
    const window = stageWindow(stage.kind, elapsed);
    if (!window) continue;
    const total = stage.curve.progress.at(-1);
    if (!(total > 0) || window[1] - window[0] < 1e-3) continue;
    const phase = stagePhase(stage.kind, elapsed);
    // The same raised shape before and after the verdict; only colour and opacity change.
    const band = phase === "approved" ? "approved" : phase === "refused" ? "rejected" : "pending";
    for (const piece of [...curveColumns(stage.curve, window[0] * total, window[1] * total),
                         ...curveRibbon(stage.curve, window[0] * total, window[1] * total)])
      corridors.push(extrusion(piece, {asset:stage.asset, phase:band}));
    const headline =
      phase === "approved" ? `${t("ph_approved")} · ${stage.by}`
      : phase === "refused" ? `${t("ph_refused")} · ${stage.reason}`
        + (stage.params?.route_choice && stage.drafter ? ` · ${stage.drafter}` : "")
      : phase === "drawing" && stage.drafter ? `${t(PHRASE[phase])} · ${stage.drafter}`
      : t(PHRASE[phase]);
    labels.push({type:"Feature",
      properties:{kind: phase === "approved" ? "approved"
                      : phase === "refused" ? "rejected" : "pending",
        label: headline},
      // Following the growing head keeps the text moving and unreadable, so it stays at the start.
      geometry:{type:"Point", coordinates:labelAnchor(stage.curve)}});
    const alpha = stageFade(stage.kind, elapsed);
    let opacity = 1;
    if (phase === "approved" || phase === "refused"){
      const duration = stage.kind === "approved" ? APPROVED_HOLD_MS : HOLD_MS;
      const step = (elapsed - GROW_MS - CHECK_MS) / duration;
      const blink = step < 1 ? .3 + .7 * Math.abs(Math.cos(step * Math.PI * 3)) : 1;
      opacity = blink * (stage.kind === "rejected" ? alpha : 1);
    }
    corridorAlpha(stage.asset, opacity);
    // A crossing refusal shows who it crosses — that aircraft's corridor blinks too.
    if (phase === "refused" && stage.params?.blocked_kind === "traffic" && stage.params.blocked_asset)
      corridorAlpha(stage.params.blocked_asset, opacity);
    // What blocked it also shows only after the verdict.
    if (phase === "refused"){
      if (stage.blocker) blockers.push({
        type:"Feature", properties:{height:stage.blocker.height},
        geometry:{type:"Polygon", coordinates:[closedRing(stage.blocker.polygon)]}});
      if (stage.breach) breaches.push({
        type:"Feature", properties:{label:blockedLabel(stage.breach.params)},
        geometry:{type:"Point", coordinates:[stage.breach.at.lon, stage.breach.at.lat]}});
    }
  }
  map.getSource("blocker")?.setData({type:"FeatureCollection", features:blockers});
  map.getSource("breach")?.setData({type:"FeatureCollection", features:breaches});
  map.getSource("stage-label")?.setData({type:"FeatureCollection", features:labels});
  return {growing};
}

const corridorLayers = new Map();
/** MapLibre's extrusion opacity is per layer, so each aircraft gets its own layer.
 * One source and one set of shapes; a phase change never rebuilds a layer. */
function corridorAlpha(asset, value){
  if (!map.getSource("flightpath")) return;
  const id = `flightpath:${asset}`;
  const opacity = Math.round(value * 20) / 20 * .85;
  if (!corridorLayers.has(asset)){
    map.addLayer({id, type:"fill-extrusion", source:"flightpath",
      filter:["==",["get","asset"],asset],
      paint:{"fill-extrusion-color":["match",["get","phase"],
          "pending","#ffd23f", "rejected","#ff3b30", "#29c76f"],
        "fill-extrusion-base":["get","base"], "fill-extrusion-height":["get","height"],
        "fill-extrusion-opacity":opacity,
        "fill-extrusion-opacity-transition":{duration:0}}}, "blocker");
  } else if (corridorLayers.get(asset) !== opacity){
    map.setPaintProperty(id, "fill-extrusion-opacity", opacity);
  }
  corridorLayers.set(asset, opacity);
}

function expireDenials(now){
  // A stage whose start time has not come (booked behind the previous one) is not over. Dropping it
  // for a null window meant an approval arriving just before the red ended skipped its yellow, and a
  // green corridor popped up.
  stages = stages.filter(s => now < s.at || stageWindow(s.kind, now - s.at) !== null);
  if (now >= denialUntil) document.getElementById("denial").hidden = true;
  if (now >= advisoryUntil) document.getElementById("advisory").hidden = true;
}

const TAG = {auto:["t-auto","t_auto"], denied:["t-deny","t_denied"],
             human:["t-human","t_human"], queued:["t-human","t_queued"]};
/** The tag on a ledger row. Filings carry their verdict. Rows the runtime wrote are events: a
 * neutral NOTE, never a refusal or an approval — except a card still waiting for a person. */
function feedTag(entry){
  const verdict = entry.decision?.verdict;
  if (isFiling(entry)) return TAG[verdict] || ["t-auto", verdict];

// Rows kept on the ledger card. Anything more is for the ledger file and the report.
const FEED_LINES = 10;

// Debug handle. Outside tools (playwright) only read page state through it; nothing writes here.
if (typeof window !== "undefined")
  window.__skynet = {map, motion, flights, queued, api:{sim:SIM, rt:RT}, director, toggleSignals,
    get latest(){ return latest; }, get stages(){ return stages; },
    get signals(){ return signalEvents; }, get demo(){ return DEMO; }};

function renderFeed(runtime){
  const seen = new Set(), lines = [];
  let briefed = false;
  for (const entry of runtime.ledger){
    if (entry.outcome === "pending" || seen.has(entry.id)) continue;
    // Last round's rows are not shown. After a restart, a leftover directive refusal would read as
    // something happening now.
    if (roundStartedAt && entry.at < roundStartedAt) continue;
    seen.add(entry.id);
    const p = entry.proposal, d = entry.decision;
    // Briefing rows: the newest run only, as one neutral line.
    if (BRIEFING_ROWS.has(p.action)){
      if (p.action !== "briefing_run" || briefed) continue;
      briefed = true;
    }
    const [cls, key] = feedTag(entry);
    const word = t(key);
    const who = d.approved_by ? ` · ${d.approved_by}` : "";
    const how = d.arbiter && String(d.arbiter).startsWith("ultra") ? " · ultra" : "";
    const tier = tierOf(p.author, p.asset_id);
    const wrote = tier ? ` <span class="tier">${safe(tier)}</span>` : "";
    const drafter = ROUTED.includes(p.action) ? drafterWord(p.params, p.params?.legs) : "";
    const drew = drafter && drafter !== t("drafter_straight") ? ` · ${safe(drafter)}` : "";
    const why = d.detail?.arbiter_reason ? `<div class="note">${safe(d.detail.arbiter_reason)}</div>` : "";
    // When the model picked among candidates, one line for it — what and why it picked is not the verdict's reason.
    const chose = choiceWords(p.params, p.asset_id);
    const picked = chose ? `<div class="note">${safe(chose)}</div>` : "";
    lines.push(`<div class="ev" data-asset="${safe(p.asset_id)}" data-entry="${safe(entry.id)}"><span class="tag ${cls}">${word}</span>
      <b>${safe(assetWord(p.asset_id))}</b>${wrote} ${t(p.action)}${drew}
      <div class="meta">${reasonText(entry)}${who}${how}</div>${picked}${why}</div>`);
    if (lines.length >= FEED_LINES) break;
  }
  // An empty ledger is an empty box: the card appears with the first decision.
  const feed = document.getElementById("feed");
  feed.innerHTML = lines.join("");
  document.getElementById("acts").hidden = !lines.length;
  // When the card outgrows the screen, fade its bottom edge so a clipped row does not look broken.
  const fade = feed.scrollHeight > feed.clientHeight ? "linear-gradient(#000 calc(100% - 40px), transparent)" : "";
  feed.style.maskImage = fade;
  feed.style.webkitMaskImage = fade;
  renderLlmLine(runtime);
}

// ---------- Runtime briefing ----------
// What the runtime gathered by search and read: cranes, events, closures, restrictions. Only a

  closure:'<rect x="1.4" y="5.6" width="13.2" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M4 5.6 7 9.6M8.2 5.6l3 4M3 9.6V14M13 9.6V14" stroke="currentColor" stroke-width="1.2"/>',
  restriction:'<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M3.8 3.8 12.2 12.2" stroke="currentColor" stroke-width="1.3"/>',
  weather:'<path d="M4.6 12.4h7.1a2.8 2.8 0 0 0 .3-5.6A4 4 0 0 0 4.4 7.3a2.6 2.6 0 0 0 .2 5.1Z" fill="none" stroke="currentColor" stroke-width="1.2"/>',
  info:'<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M8 7.2v4.4" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="4.8" r=".9" fill="currentColor"/>',

// An item's standing. The runtime sends it as status (applied · approved · held · info · refused ·
// lapsed …); trust says whether the source domain is official, so it is not the tag. A standing sent
// in trust (applied · held · info) is accepted too.
const STANDING = {applied:["t-auto", "bf_applied"], approved:["t-auto", "bf_applied"], held:["t-human", "bf_held"],

function standingOf(item){
  return STANDING[item.status] || STANDING[item.trust] || STANDING.info;
}

function briefingItems(runtime = lastRuntime){

}
/** Find a briefing item by rule id, to name what caused a refusal. */
function briefingFor(id){
  if (!id) return null;
  const item = briefingItems().find(entry => entry.rule_id === id || entry.id === id);
  if (item) return item;
  // Gone from the item list (only the latest few are sent), it is still in the notice book with its source.
  const notice = (lastRuntime?.notices || []).find(n => n.id === id && n.citation);
  return notice ? {kind:notice.kind, rule_id:id, domain:notice.citation.domain,
                   recorded:Boolean(notice.citation.recorded),

 * The source domain, marked when it is recorded (a hand-written scene or an answer saved earlier).

}

    + `<svg class="kind" viewBox="0 0 16 16" role="img" aria-label="${word}"><title>${word}</title>${KIND_GLYPH[kind]}</svg>`
    + `<div><div class="bi-top"><b>${safe(item.place || word)}</b><span class="tag ${cls}">${t(key)}</span></div>`

/**
 * What briefing rules leave on the map. The runtime files a BriefingNotice per rule in the notice book —
 * id is the item's rule_id, the place is polygon (a circle), a crane's height is ceiling_m, the source
 * is citation. Only applied rules are drawn: one waiting for a person blocks nothing. Events and
 * restrictions are painted as notices with their names, cranes stand, closed landing areas go grey.
 */
function briefingMarks(runtime, world){
  const marks = {cranes:[], closed:new Map()};
  const items = new Map(briefingItems(runtime).filter(item => item.rule_id).map(item => [item.rule_id, item]));
  for (const notice of runtime?.notices || []){
    const item = items.get(notice.id);
    if ((!notice.citation && !item) || !notice.applied) continue;
    const domain = sourceWord(notice.citation?.domain || item?.domain,

    if (notice.kind === "crane"){
      const at = ringCentre(notice.polygon), height = Number(notice.ceiling_m);
      if (at && height > 0) marks.cranes.push({...at, height, label:t("bf_crane", Math.round(height), domain)});
    } else if (notice.kind === "closure"){
      // A closure circle (60 m radius) is centred on a landing area: the one inside it, else the one
      // whose name matches.
      const ring = notice.polygon?.length > 2 ? closedRing(notice.polygon) : null;
      for (const area of world?.landing_areas || [])
        if ((ring && insideRing(ring, area.lon, area.lat)) || (item && sameArea(area, item)))

function ringCentre(polygon){

  const name = String(area.name || "").toLowerCase(), place = String(item.place || "").toLowerCase();
  return Boolean(name && place) && (place.includes(name) || name.includes(place));

  const parts = [], labels = [];
  for (const crane of marks.cranes || []){
    for (const piece of craneShape(crane.lat, crane.lon, crane.height)) parts.push(extrusion(piece, {}));
    labels.push({type:"Feature", geometry:{type:"Point", coordinates:[crane.lon, crane.lat]},
                 properties:{label:crane.label}});
  }
  map.getSource("brief-crane")?.setData({type:"FeatureCollection", features:parts});
  map.getSource("brief-crane-label")?.setData({type:"FeatureCollection", features:labels});
}

// ---------- The model's part ----------
// params.model_trace carried on the filing, in plain words; the raw JSON is never shown. A filing
// without one (older rows) shows only who wrote and who drew it. The runtime always judged, and says so.
const FALLBACK_WHY = {"no model":"why_no_model", "timeout":"why_timeout", "invalid action":"why_invalid"};
const TRACE_GAP_PX = 56;

/** Can this device hover? Touch cannot, so a tap stands in for it. */
function canHover(){
  return typeof matchMedia !== "function" || matchMedia("(hover: hover)").matches;
}
function latestFiling(asset){
  return (lastRuntime?.ledger || []).find(e => e.proposal?.asset_id === asset
    && e.proposal.author !== "runtime" && e.outcome !== "pending") || null;
}
/** Display name of the model on that aircraft; the registered display name when the id matches. */
function traceName(asset, model){
  const agent = lastRuntime?.agents?.[asset];
  const id = model || agent?.model || "";
  if (!id) return t("model_rules");
  if (agent?.model === id && agent.display && !/^rules$/i.test(agent.display)) return asModelName(agent.display);
  return asModelName(modelName(id));
}
function secondsWord(ms){
  return ms == null || !Number.isFinite(Number(ms)) ? "" : t("tr_secs", (Number(ms) / 1000).toFixed(1));
}
function clip(text, max){
  const value = String(text ?? "");

}
function traceHtml(entry){
  const p = entry.proposal, form = p.params?.model_trace?.form || {};
  const name = p.params?.model_trace
    ? traceName(p.asset_id, form.model)
    : (p.author && p.author !== "rules" ? traceName(p.asset_id, p.author) : t("model_rules"));
  // Latency only for forms a model wrote. Rules forms arrive with latency_ms 0 and showed a meaningless "0.0 s".
  const latency = form.model ? secondsWord(form.latency_ms) : "";
  const rows = traceRows(entry);
  return `<div class="bar"><b>${safe(name)}</b><span class="meta">${safe(p.asset_id)}`
    + `${latency ? ` · ${latency}` : ""}</span></div>`
    + `<dl>${rows.map(([key, value]) => `<dt>${key}</dt><dd>${value}</dd>`).join("")}</dl>`;
}
function traceRows(entry){
  const p = entry.proposal, params = p.params || {}, trace = params.model_trace;
  if (!trace){
    const rows = [[t("tr_form_by"), safe(tierOf(p.author, p.asset_id) || t("by_rules"))]];
    const drafter = drafterWord(params, params.legs);
    if (drafter) rows.push([t("tr_route_by"), safe(drafter)]);
    return rows;
  }
  const form = trace.form || {}, rows = [];
  if (form.concern) rows.push([t("tr_asked"), safe(form.concern)]);
  rows.push([t("tr_answered"), form.model ? answerWords(form) : t("tr_no_answer")]);
  rows.push([t("tr_code"), codeWords(form)]);
  const route = routeWords(trace.route, params);
  if (route) rows.push([t("tr_route"), route]);
  rows.push([t("tr_runtime"), `${t(VERDICT_WORD[entry.decision?.verdict] || "t_auto")} — ${safe(reasonText(entry))}`]);
  return rows;
}
function answerWords(form){

}

function routeWords(route, params){
  const source = route?.source || "", draft = route?.draft;

  // ledger). The pick comes first.
  if (source === "choice" || (route?.choice && !failed && source !== "draft"))
    return choiceTrace(route.choice, params);

    return failed ? t("tr_draft_failed", breachWords(draft.breach))

function latestChoice(asset){

  const same = traceTarget?.from === "aircraft" && traceTarget.asset === asset
    && traceTarget.entry === entry.id && traceTarget.lang === lang;
  traceTarget = {from:"aircraft", asset, entry:entry.id, lang, point:point || traceTarget?.point};

  if (!entry || entry.proposal?.author === "runtime") return;
  const box = row.getBoundingClientRect?.();
  traceTarget = {from:"feed", asset:entry.proposal.asset_id, entry:entry.id,

function moveTrace(card){
  const element = card || document.getElementById("trace");
  if (!element || element.hidden || !traceTarget?.point) return;
  const size = {w:element.offsetWidth || 300, h:element.offsetHeight || 190};
  const view = {w:globalThis.innerWidth || 1500, h:globalThis.innerHeight || 940,

/**

  if (anchor.x - gap - size.w >= margin) return {left:anchor.x - gap - size.w, top:inView(anchor.y - size.h / 2)};
  const left = Math.max(margin, Math.min(right - size.w, anchor.x - size.w / 2));

// ---------- The runtime and its links ----------
