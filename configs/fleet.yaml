# The runtime does not know what a landing pad is. This file sets the domain.
name: manhattan-delivery

resources:
  - pad:launch

authority:
  # No spending limits. Budget is the operator's (the company's) business; this runtime judges
  # only safety (route, altitude, zones, separation). Put a number here and filings over it go
  # to a human.
  per_asset_usd: null
  fleet_usd: null
  # A human always reviews these impact scopes
  human_required_blast:
    - public
    - passenger
  # A human reviews these actions regardless of cost
  human_required_actions:
    - disengage_autonomy

# Blanket bans such as a recall. Checked before the limits, and never put to a model.
# When the simulator posts a notice, the runtime adds a line here.
policies: []

# Nebius Token Factory model ids. super is confirmed; ultra's capitalisation is unconfirmed;
# if nano is not in the list, Nemotron 3.5 Lightning (30B-A3B, 2026-08) takes its place.
# `scripts/llm_probe.py` shows the real list via GET /v1/models. The environment variables
# MODEL_NANO/MODEL_SUPER/MODEL_ULTRA override these (local Ollama = nemotron-3-nano).
models:
  nano: nvidia/Nemotron-3_5-Lightning
  super: nvidia/nemotron-3-super-120b-a12b
  ultra: nvidia/Nemotron-3-Ultra-550b-a55b

# Aircraft performance as declared by the operator, and the round's clock. From these the runtime
# computes the 4D intent of each cleared route (which segment, when) and refuses filings that
# overlap another aircraft's intent. Must match the simulator constants (sim/world.py);
# tests/test_intents.py checks. clock_epoch_z is the Zulu time of tick 0 — the reference for
# turning a NOTAM time window such as "0907-0912Z" into ticks.
performance:
  cruise_mps: 22.0
  climb_mps: 2.0
  descent_mps: 1.75
  seconds_per_tick: 0.8
  clearance_ticks: 25
  clock_epoch_z: "0900"
  # Navigation error. Corridor half-width = 30 m separation minimum + this. Must exceed the
  # simulator's 6 m waypoint radius.
  nav_tolerance_m: 10.0
  # Lost-link contingency. An autopilot that loses the link flies the cleared route as is and
  # lands at the destination (continue_and_land). The runtime declares lost link when an airborne
  # aircraft's telemetry has not refreshed for timeout_ticks, keeps that aircraft's intent
  # (cleared route + landing column) reserved, and raises a card for a human. Other behaviours
  # (return_to_launch etc.) are not judged yet; writing one here gets every route filing refused.
  lost_link:
    behaviour: continue_and_land
    timeout_ticks: 15

# Weather limits. When a report (simulator notice, Tavily search, manual entry) is outside these,
# the runtime stops takeoffs (WEATHER HOLD: fly_route, reserve_pad and depart filed from the
# ground are refused; aircraft already airborne carry on and land). A later report within limits
# does not lift it by itself — the window closes or a human lifts it (approval screen). A report
# with no window holds for hold_default_ticks (0.8 s/tick, 500 ticks ≈ 6.7 min).
weather:
  max_wind_mps: 10
  max_gust_mps: 12
  min_visibility_m: 1500
  hold_default_ticks: 500

# Dispatch: which aircraft visits which landing site, in what order. That is the operator's job
# (here the simulator's). The runtime does not read this section — it judges the routes it gets
# and never decides who takes which order. The code is sim/dispatch.py; whichever solver plans,
# the aircraft still files its own route to each stop.
# solver: rules  — today's rule-based dispatch (seed 7 plays the same round).
# solver: cuopt  — asks an NVIDIA cuOpt server (GPU, Nebius AI Cloud) for the fleet's next trip.
#                  If the server is missing, slow or answers oddly, the rule picks that stop and
#                  cuOpt is skipped for backoff_s.
# The environment variables DISPATCH / CUOPT_URL / CUOPT_TIMEOUT_S / CUOPT_TIME_LIMIT_S /
# CUOPT_BACKOFF_S take precedence.
dispatch:
  solver: rules
  cuopt_url: ""
  timeout_s: 2.0        # longest the world thread waits (s); the ticks stop for that long
  time_limit_s: 1.0     # solve time on the server (s)
  backoff_s: 60         # after a failure, use the rule for this long (s)

# Intake. Only when TAVILY_API_KEY is set are the queries below searched, every INTAKE_PERIOD_S.
# The grammar (METAR phrasing, incidents with an address) reads the results first; only what it
# cannot read is structured by Super, and that waits for a human to confirm.
# metar_stations are fetched without a key from aviationweather.gov every METAR_PERIOD_S (default
# 300 s). They get the same trust as the runtime's own feed (applied on the tick the grammar reads
# them) — an official observation, not a web page.
# METAR_STATIONS in the environment replaces this list. Without a network this source is off.
intake:
  queries:
    - "New York City wind gust forecast today"
    - "NYC temporary flight restriction drones today"
    - "Manhattan building fire today"
  metar_stations: [KNYC, KLGA]

# Pre-flight briefing (backend/intake/briefing.py). When a round starts, and when a just-cleared corridor
# enters a neighbourhood (a cell of about cell_km) not yet asked about this round, the runtime
# asks Tavily about that place and time: events and crowds (in September, VIP flight restrictions
# for UN General Assembly week), tower cranes (not in the building data), closures of the parks
# and piers used as landing sites, temporary flight restrictions, weather advisories. The grammar
# reads (Super fills the form only for prose it cannot read) and code checks.
# What the grammar read from trusted_domains applies on that tick (it is a tightening rule);
# anything from other domains, or read by a model, waits for a human on the approval screen.
# Weather advisories are information only (takeoff holds come from METAR).
# Without a key it runs on the recordings in tests/fixtures/tavily, flagged as recorded on the
# screen, in the ledger and in the records. The per-round credit limit is the environment
# variable TAVILY_BUDGET_PER_ROUND (default 20), shared with the intake searches above.
# {park} {street} {borough} {date} {year} in the queries are filled from the landing sites, the
# gazetteer and the briefing date.
briefing:
  trusted_domains: [faa.gov, weather.gov, noaa.gov, nyc.gov, nycgovparks.org, cityofnewyork.us]
  cell_km: 1.0
  max_cells_per_run: 4
  corridor_debounce_ticks: 12
  corridor_min_gap_ticks: 25
  closure_radius_m: 60       # refuse landings within this + the 50 m landing clearance
  crane_radius_m: 30         # crane footprint; 40 m lateral + crane_clearance_m vertical added
  crane_clearance_m: 50      # same vertical clearance as buildings
  max_window_ticks: 6000     # windows are cut here (0.8 s/tick, 80 min); re-applied each round
  max_queries_per_run: 8
  research: true             # one Tavily research per round start (mini, 4-110 credits each)
  research_model: mini
  queries:
    round:
      - "FAA temporary flight restriction New York City drone {date}"
      - "National Weather Service New York City wind advisory {date}"
    seasonal:
      9: ["United Nations General Assembly {year} flight restrictions East Side Manhattan"]
    park: ["{park} closure {date}"]
    street: ["tower crane permit near {street} {borough}"]
  # Official sites crawled at each round start. crawl = map (1 credit per 10 pages) + extract
  # (1 per 5 pages).
  crawl:
    - url: "https://tfr.faa.gov/"
      instructions: "active temporary flight restrictions for New York, NY"
      limit: 6
